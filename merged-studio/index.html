      // v2: resolve a library yearRange link (engine/transmission id) to a real catalog entry.
      // Exact id first, then the gm_* alias map, then a gm_ prefix strip. Anything that does
      // not resolve is "not in the library yet" — never a guessed entry.
      const resolveLibraryLink = (linkId, kind) => {
        if (!linkId) return null;
        const list = kind === 'engine' ? LIBRARY_ENGINES : LIBRARY_TRANSMISSIONS;
        const direct = list.find((e) => e.id === linkId);
        if (direct) return direct;
        const aliased = LIBRARY_ID_ALIASES[linkId];
        if (aliased) return list.find((e) => e.id === aliased) || null;
        const stripped = linkId.replace(/^gm_/, '');
        return list.find((e) => e.id === stripped) || null;
      };

      // v2: pick-and-implement — one active part everywhere (bench + drawing + BOM).
      // Entries WITH bench dimensions drive the 3D bench; parameters-only entries load
      // honestly as parameters-only (no fake mesh, no placeholder dims). Wall / fillet /
      // bolt count for catalog engines come from the v16 cast-block preset and are labeled
      // as such — bore, stroke and deck height come from the entry itself.
      const loadLibraryEntry = (kind, entry) => {
        if (!entry) return;
        const part = buildActivePart(kind, entry);
        if (!part) return;
        setActivePart(part);
        if (kind === 'concept') {
          applyLibraryEntryToBench(entry);
          return;
        }
        if (kind === 'engine' || kind === 'storeEngine') {
          setParams({
            boreIn: entry.bore,
            strokeIn: entry.stroke,
            wallIn: 0.25,
            boltCount: 17,
            filletIn: 0.25,
            materialId: entry.blockMaterial === 'aluminum' ? 'al7075' : 'cast_iron_g3500'
          });
          if (typeof entry.deckHeight === 'number') setDeckHeightIn(entry.deckHeight);
          if (entry.id === 'sbc_350_ray') {
            notify(`${RAYS_BUILD.name}: 385 HP / 414 TQ carb · Bore Ø 4.000 × Stroke 3.480 in`);
          } else {
            const dyno = entry.dyno || {};
            notify(
              `Loaded — ${entry.shortName || entry.name} · Bore Ø ${entry.bore} × Stroke ${entry.stroke} in${
                dyno.baseHp ? ` · ${dyno.baseHp} HP / ${dyno.baseTq} TQ [EST]` : ''
              }`
            );
          }
          return;
        }
        if (kind === 'transmission') {
          notify(
            `Loaded (parameters only) — ${entry.name} · ${entry.ratios.length}-speed ${entry.ratios.join('/')} · ${entry.lengthInches} in · No mesh`
          );
          return;
        }
        if (kind === 'model') {
          notify(
            `Loaded (parameters only) — ${entry.make} ${entry.model} · ${entry.yearStart}–${entry.yearEnd || 'present'} · No mesh`
          );
          return;
        }
        if (kind === 'part') {
          notify(
            `Loaded (parameters only) — ${entry.name} · ${entry.group} · ${entry.fields.length} fields · No mesh`
          );
          return;
        }
      };

      // v2: linked pages — load the part, then switch rooms with the same active part.
      const openPartInRoom = (roomId, kind, entry) => {
        loadLibraryEntry(kind, entry);
        setActiveRoom(roomId);
      };

      // v2: two-way dimension editing — the drafting room writes the same params the
      // 3D bench reads, so a change here updates the bench and vice versa.
      const handleDraftingDimChange = (key, value) => {
        const num = parseFloat(value);
        if (Number.isNaN(num)) return;
        if (key === 'deckHeightIn') {
          setDeckHeightIn(num);
          return;
        }
        if (key === 'boltCount') {
          setParams((p) => ({ ...p, boltCount: Math.max(8, Math.min(36, Math.round(num))) }));
          return;
        }
        setParams((p) => ({ ...p, [key]: num }));
      };

      const handleDownloadDraftingSvg = () => {
        if (!draftingSvgRef.current) return;
        const xml = new XMLSerializer().serializeToString(draftingSvgRef.current);
        triggerDownload(xml, `${domain}-drafting-studio-v2.svg`, 'image/svg+xml;charset=utf-8');
        notify('Downloaded .SVG Drafting Studio Sheet');
      };

      const addEntryToBom = (kind, entry) => {
        if (!entry || !entry.id) return;
        const stamped = { ...entry, _kind: kind };
        setActiveMatrixItems((prev) => {
          if (prev.some((x) => x.id === entry.id)) return prev;
          return [stamped, ...prev];
        });
        notify(`Added ${entry.code || entry.id} to Active BOM`);
      };

      const kindOfBomItem = (item) => {
        if (!item) return 'concept';
        if (item._kind) return item._kind;
        if (LIBRARY_MODELS.some((m) => m.id === item.id)) return 'model';
        if (LIBRARY_ENGINES.some((e) => e.id === item.id)) return 'engine';
        if (LIBRARY_STORE_ENGINES.some((e) => e.id === item.id)) return 'storeEngine';
        if (LIBRARY_TRANSMISSIONS.some((t) => t.id === item.id)) return 'transmission';
        if (LIBRARY_PART_SYSTEMS.some((p) => p.id === item.id)) return 'part';
        return 'concept';
      };

      // v2: one card renderer for every library kind — same Load + linked-page actions.
      const renderLibraryCard = (kind, entry, opts = {}) => {
        const inBom = activeMatrixItems.some((x) => x.id === entry.id);
        const loadLabel =
          kind === 'engine' || kind === 'storeEngine' || kind === 'concept'
            ? 'Load to 3D Bench'
            : 'Load (parameters only)';
        const openRow = (
          <div className="grid grid-cols-3 gap-1.5">
            <button
              type="button"
              onClick={() => openPartInRoom('build', kind, entry)}
              className="min-h-[44px] px-2 rounded-lg bg-[#151E30] border border-slate-700 text-[11px] font-semibold text-sky-200 touch-manipulation active:scale-95"
            >
              Sketch &amp; Build
            </button>
            <button
              type="button"
              onClick={() => openPartInRoom('inspect', kind, entry)}
              className="min-h-[44px] px-2 rounded-lg bg-[#151E30] border border-slate-700 text-[11px] font-semibold text-sky-200 touch-manipulation active:scale-95"
            >
              Inspect &amp; Slice
            </button>
            <button
              type="button"
              onClick={() => openPartInRoom('drafting', kind, entry)}
              className="min-h-[44px] px-2 rounded-lg bg-amber-500/15 border border-amber-500/40 text-[11px] font-semibold text-amber-300 touch-manipulation active:scale-95"
            >
              Open Drawing
            </button>
          </div>
        );
        const bomButton = opts.showRemove ? (
          <button
            type="button"
            onClick={() => {
              setActiveMatrixItems((prev) => prev.filter((x) => x.id !== entry.id));
              notify(`Removed ${entry.code || entry.id} from Active BOM`);
            }}
            className="w-full min-h-[44px] px-2.5 rounded-lg bg-red-500/15 border border-red-500/40 text-xs font-semibold text-red-300 touch-manipulation active:scale-95"
          >
            Remove from Active BOM
          </button>
        ) : (
          <button
            type="button"
            onClick={() => addEntryToBom(kind, entry)}
            disabled={inBom}
            className="w-full min-h-[44px] px-2.5 rounded-lg bg-emerald-500/15 border border-emerald-500/40 text-xs font-semibold text-emerald-300 touch-manipulation active:scale-95 disabled:opacity-50"
          >
            {inBom ? '✓ In Active BOM' : '+ Add to Active BOM'}
          </button>
        );
        const actionRows = (
          <div className="space-y-1.5">
            <div className="grid grid-cols-2 gap-1.5">
              <button
                type="button"
                onClick={() => loadLibraryEntry(kind, entry)}
                className="min-h-[44px] px-2.5 rounded-lg bg-sky-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
              >
                {loadLabel}
              </button>
              {bomButton}
            </div>
            {openRow}
          </div>
        );

        if (kind === 'model') {
          return (
            <div key={entry.id} className="p-3 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <div className="font-mono-tabular text-[11px] text-sky-400">
                    {entry.make} · {entry.category}
                  </div>
                  <div className="text-xs font-bold text-slate-100">
                    {entry.make} {entry.model}
                  </div>
                  <div className="font-mono-tabular text-[11px] text-slate-400 mt-0.5">
                    {entry.yearStart}–{entry.yearEnd || 'present'} · {(entry.chassisCodes || []).join(' / ')}
                  </div>
                  <div className="text-[11px] text-slate-400 mt-1">
                    Sources: {(entry.sources || []).join(' · ') || 'UNVERIFIED'}
                  </div>
                </div>
                <span className="px-2 py-0.5 rounded font-mono-tabular text-[10px] shrink-0 bg-amber-500/15 text-amber-300 border border-amber-500/30">
                  {entry.verificationStatus}
                </span>
              </div>
              <button
                type="button"
                onClick={() => setLibDetailId((v) => (v === entry.id ? null : entry.id))}
                className="w-full min-h-[40px] px-2.5 rounded-lg bg-[#151E30] border border-slate-700 text-[11px] font-semibold text-sky-200 touch-manipulation"
              >
                {libDetailId === entry.id
                  ? 'Hide year ranges & powertrain links'
                  : `Show ${(entry.yearRanges || []).length} year ranges & powertrain links`}
              </button>
              {libDetailId === entry.id && (
                <div className="space-y-2">
                  {(entry.yearRanges || []).map((r, ri) => (
                    <div key={ri} className="p-2 rounded-lg bg-[#0E1420] border border-slate-800 space-y-1.5">
                      <div className="text-[11px] font-bold text-slate-200">
                        {r.yearStart}–{r.yearEnd} · {r.trimNote}
                      </div>
                      <div className="text-[11px] text-slate-300 leading-relaxed">
                        Engines:{' '}
                        {(r.engineIds || []).map((id, ii) => {
                          const e = resolveLibraryLink(id, 'engine');
                          return e ? (
                            <button
                              key={id}
                              type="button"
                              onClick={() => loadLibraryEntry('engine', e)}
                              className="inline-block mr-1 mb-1 px-2 py-1 rounded bg-sky-500/15 border border-sky-400/40 text-sky-200 font-mono-tabular text-[10px] touch-manipulation"
                            >
                              {e.shortName || e.name}
                            </button>
                          ) : (
                            <span key={id} className="inline-block mr-1 mb-1 px-2 py-1 rounded bg-slate-900 border border-slate-800 text-slate-500 font-mono-tabular text-[10px]">
                              {id} — not in the library yet
                            </span>
                          );
                        })}
                      </div>
                      <div className="text-[11px] text-slate-300 leading-relaxed">
                        Transmissions:{' '}
                        {(r.transmissionIds || []).map((id) => {
                          const t = resolveLibraryLink(id, 'transmission');
                          return t ? (
                            <button
                              key={id}
                              type="button"
                              onClick={() => loadLibraryEntry('transmission', t)}
                              className="inline-block mr-1 mb-1 px-2 py-1 rounded bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 font-mono-tabular text-[10px] touch-manipulation"
                            >
                              {t.name}
                            </button>
                          ) : (
                            <span key={id} className="inline-block mr-1 mb-1 px-2 py-1 rounded bg-slate-900 border border-slate-800 text-slate-500 font-mono-tabular text-[10px]">
                              {id} — not in the library yet
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {actionRows}
            </div>
          );
        }

        if (kind === 'engine' || kind === 'storeEngine') {
          const isStore = kind === 'storeEngine';
          return (
            <div key={entry.id} className="p-3 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <div className="font-mono-tabular text-[11px] text-sky-400">
                    {entry.make} · {entry.era || entry.family} · {entry.configLabel}
                  </div>
                  <div className="text-xs font-bold text-slate-100">{entry.name}</div>
                  <div className="font-mono-tabular text-[11px] text-slate-400 mt-0.5">
                    Bore Ø {entry.bore} in × Stroke {entry.stroke} in · Deck {entry.deckHeight} in ·{' '}
                    {entry.cylinders} cyl{!isStore && entry.staticCR ? ` · CR ${entry.staticCR}` : ''}
                    {isStore && entry.cid ? ` · ${entry.cid} CID` : ''}
                  </div>
                  {!isStore && entry.firingOrder && (
                    <div className="text-[11px] text-slate-400">Firing order: {entry.firingOrder}</div>
                  )}
                  {isStore && (
                    <div className="text-[11px] text-slate-400">
                      {entry.yearStart}–{entry.yearEnd} · {entry.fuelSystem} · {entry.baseHp} HP / {entry.baseTq} TQ
                    </div>
                  )}
                  {!isStore && entry.dyno && (
                    <div className="text-[11px] text-amber-200/90">
                      {entry.id === 'sbc_350_ray'
                        ? `${RAYS_BUILD.name}: 385 HP / 414 TQ carb · MPFI 408 / 431 PROVISIONAL (catalog stores baseTq=415, pending dyno audit)`
                        : `${entry.dyno.baseHp} HP / ${entry.dyno.baseTq} TQ @ ${entry.dyno.hpPeakRpm} rpm [EST] Simulated`}
                    </div>
                  )}
                  <div className="text-[11px] text-slate-400 mt-1">
                    Source: {entry.source || (entry.sources || []).join(' · ') || 'UNVERIFIED'}
                  </div>
                  {!isStore && entry.estimatedFields && entry.estimatedFields.length > 0 && (
                    <div className="text-[11px] text-amber-300/80">[EST] fields: {entry.estimatedFields.join(', ')}</div>
                  )}
                  {!isStore && entry.measurementNeededFields && entry.measurementNeededFields.length > 0 && (
                    <div className="text-[11px] text-amber-300/80">
                      NEEDING RAY'S MEASUREMENT: {entry.measurementNeededFields.join(', ')}
                    </div>
                  )}
                  {isStore && entry.recommendedTransId && (
                    <div className="text-[11px] text-slate-300">
                      Recommended transmission:{' '}
                      {(() => {
                        const t = resolveLibraryLink(entry.recommendedTransId, 'transmission');
                        return t ? (
                          <button
                            type="button"
                            onClick={() => loadLibraryEntry('transmission', t)}
                            className="px-2 py-1 rounded bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 font-mono-tabular text-[10px] touch-manipulation"
                          >
                            {t.name}
                          </button>
                        ) : (
                          <span className="text-slate-500">{entry.recommendedTransId} — not in the library yet</span>
                        );
                      })()}
                    </div>
                  )}
                </div>
                <span className="px-2 py-0.5 rounded font-mono-tabular text-[10px] shrink-0 bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                  {isStore ? 'STORE' : 'CATALOG'}
                </span>
              </div>
              {actionRows}
            </div>
          );
        }

        if (kind === 'transmission') {
          return (
            <div key={entry.id} className="p-3 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <div className="font-mono-tabular text-[11px] text-sky-400">
                    {entry.category} · {entry.type}
                  </div>
                  <div className="text-xs font-bold text-slate-100">{entry.name}</div>
                  <div className="font-mono-tabular text-[11px] text-slate-400 mt-0.5">
                    {entry.ratios.length} speeds: {entry.ratios.join(' / ')} · Rev {entry.reverse} ·{' '}
                    {entry.lengthInches} in{entry.defaultStall ? ` · Stall ${entry.defaultStall} rpm` : ''}
                  </div>
                  <div className="text-[11px] text-slate-400 mt-1">{entry.desc}</div>
                  <div className="text-[11px] text-amber-300/80">{entry.tunnelProfile}</div>
                </div>
                <span className="px-2 py-0.5 rounded font-mono-tabular text-[10px] shrink-0 bg-sky-500/15 text-sky-300 border border-sky-500/30">
                  PARAMETERS ONLY
                </span>
              </div>
              {actionRows}
            </div>
          );
        }

        if (kind === 'part') {
          return (
            <div key={entry.id} className="p-3 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <div className="font-mono-tabular text-[11px] text-sky-400">
                    {entry.group} · System #{entry.order}
                  </div>
                  <div className="text-xs font-bold text-slate-100">{entry.name}</div>
                  <div className="text-[11px] text-slate-400 mt-1 leading-relaxed">{entry.description}</div>
                  <div className="text-[11px] text-slate-400 mt-1">
                    Fields ({entry.fields.length}): {entry.fields.map((f) => f.label).join(' · ')}
                  </div>
                  <div className="text-[11px] text-slate-500">
                    Subassemblies: {entry.subassemblyKeys.join(', ')} · BOM: {entry.bomCategories.join(', ')}
                  </div>
                </div>
                <span className="px-2 py-0.5 rounded font-mono-tabular text-[10px] shrink-0 bg-sky-500/15 text-sky-300 border border-sky-500/30">
                  PARAMETERS ONLY
                </span>
              </div>
              {actionRows}
            </div>
          );
        }

        // concept (the file's original 18-platform + accessories catalog)
        return (
          <div key={entry.id} className="p-3 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
            <div className="flex items-start justify-between gap-2">
              <div>
                <div className="font-mono-tabular text-[11px] text-sky-400">
                  {entry.code || entry.sku} · {entry.tolerance}
                </div>
                <div className="text-xs font-bold text-slate-100">{entry.name}</div>
                {entry.engineSpec && (
                  <div className="text-[11px] text-amber-200/90 mt-0.5">{entry.engineSpec}</div>
                )}
                <div className="font-mono-tabular text-[11px] text-slate-400 mt-0.5">
                  Bore {formatDim(entry.boreIn)} × Stroke {formatDim(entry.strokeIn)} · {entry.massLb} lb
                  {entry.powerHp ? ` · ${entry.powerHp} HP` : ''}
                </div>
                {entry.notes && (
                  <div className="text-[11px] text-slate-400 mt-1 leading-relaxed">{entry.notes}</div>
                )}
                <div className="text-[11px] text-slate-500 mt-1">
                  Concept build — the file's own concept numbers, not the standard.
                </div>
              </div>
              <span
                className={`px-2 py-0.5 rounded font-mono-tabular text-[10px] shrink-0 ${
                  entry.status === 'VERIFIED'
                    ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'
                    : 'bg-amber-500/15 text-amber-300 border border-amber-500/30'
                }`}
              >
                {entry.status}
              </span>
            </div>
            {actionRows}
          </div>
        );
      };

      const handleAskCoPilot = async (customPromptText) => {
        const query = (customPromptText || aiPrompt).trim();
        if (!query) return;
        setAiPrompt('');
        setAiMessages((prev) => [...prev, { role: 'user', text: query }]);
        setAiLoading(true);

        const synthesizePresetFromPrompt = (text) => {
          const lower = text.toLowerCase();
          if (lower.includes('sbc-350') || lower.includes('v16') || lower.includes('383') || lower.includes('head bolt')) {
            const nextDomain = 'sbc-350-v16';
            const nextParams = { boreIn: 4.030, strokeIn: 3.750, wallIn: 0.26, boltCount: 17, filletIn: 0.30, materialId: 'chromoly4140' };
            setDomain(nextDomain);
            setParams(nextParams);
            setSelectedSubsystem('Engine Block & Sump');
            return {
              code: 'SBC-V16-383',
              summary: 'Applied SBC-350 v16 Stroker / 17-Bolt Datum spec (Bore Ø 4.030 in, Stroke 3.750 in, Chromoly 4140) to the 3D bench.'
            };
          }
          if (lower.includes('billet intake plenum')) {
            const nextDomain = 'sbc-350-v20';
            const nextParams = { boreIn: 4.100, strokeIn: 3.480, wallIn: 0.24, boltCount: 18, filletIn: 0.35, materialId: 'al7075' };
            setDomain(nextDomain);
            setParams(nextParams);
            setSelectedSubsystem('Intake & Fuel Rail');
            return {
              code: 'QADS-PL-2020',
              summary: 'Synthesized Billet Intake Plenum (7075-T651, Bore Ø 4.100 in, Wall 0.240 in, Fillet R0.350 in, ASME Y14.5 IT6) and applied to SBC-350 v20.'
            };
          }
          if (lower.includes('titanium gimbal bracket')) {
            const nextDomain = 'aerospace-v20';
            const nextParams = { boreIn: 5.800, strokeIn: 4.500, wallIn: 0.28, boltCount: 24, filletIn: 0.45, materialId: 'ti6al4v' };
            setDomain(nextDomain);
            setParams(nextParams);
            setSelectedSubsystem('2-Axis Gimbal Ring');
            return {
              code: 'QADS-GB-5824',
              summary: 'Synthesized Titanium Gimbal Bracket (Ti-6Al-4V Grade 5, Bore Ø 5.800 in, Wall 0.280 in, Fillet R0.450 in, ASME Y14.5 IT5) and applied to Quantum Aerospace v20.'
            };
          }

          const isAero = /aero|thruster|cryo|gimbal|scramjet|lunar|orbital|rocket/.test(lower);
          const isTi = /titanium|ti-6al-4v/.test(lower);
          const isInconel = /inconel|exhaust|turbo|hypersonic/.test(lower);
          const nextDomain = isAero ? 'aerospace-v20' : 'sbc-350-v20';
          const nextParams = {
            boreIn: isAero ? 5.65 : 4.100,
            strokeIn: isAero ? 4.40 : 3.480,
            wallIn: 0.26,
            boltCount: isAero ? 24 : 18,
            filletIn: 0.35,
            materialId: isInconel ? 'inconel625' : isTi ? 'ti6al4v' : 'al7075'
          };
          setDomain(nextDomain);
          setParams(nextParams);
          const item = {
            id: `ai_${Date.now()}`,
            code: `QADS-AI-${Math.floor(100 + Math.random() * 899)}`,
            name: text.slice(0, 52),
            category: isAero ? 'Aerospace & Experimental' : 'Muscle & Performance',
            domain: nextDomain,
            subsystem: isAero ? 'Regen Thrust Chamber' : 'CNC Cylinder Heads',
            boreIn: nextParams.boreIn,
            strokeIn: nextParams.strokeIn,
            wallIn: nextParams.wallIn,
            boltCount: nextParams.boltCount,
            filletIn: nextParams.filletIn,
            materialId: nextParams.materialId,
            massLb: isAero ? 290 : 450,
            powerHp: isAero ? 4400 : 650,
            tolerance: 'ASME Y14.5-2018 IT5',
            status: 'PROVISIONAL',
            notes: `AI Co-Pilot synthesis for: ${text}`
          };
          setActiveMatrixItems((prev) => [item, ...prev]);
          return {
            code: item.code,
            summary: `Synthesized "${item.name}" (${item.code}) and updated 3D bench parameters + Active BOM.`
          };
        };

        try {
          const synth = synthesizePresetFromPrompt(query);
          if (geminiApiKey.trim()) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey.trim())}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: `You are a Principal Aerospace & SBC-350 CAD/Manufacturing Engineer. Domain: ${domain}, Bore: ${params.boreIn} in, Stroke: ${params.strokeIn} in, Wall: ${params.wallIn} in. Respond concisely with ASME Y14.5 GD&T, CNC/DMLS manufacturability, and torque notes for: ${query}`
                      }
                    ]
                  }
                ]
              })
            });
            const json = await res.json();
            const aiText = json?.candidates?.[0]?.content?.parts?.[0]?.text;
            setAiMessages((prev) => [
              ...prev,
              {
                role: 'assistant',
                text: aiText ? `${aiText}\n\n[${synth.summary}]` : synth.summary
              }
            ]);
          } else {
            setAiMessages((prev) => [
              ...prev,
              {
                role: 'assistant',
                text: `${synth.summary}\n• Displacement / Envelope: ${telemetry.dispStr}\n• Tolerance Check: ${telemetry.dmlsStatus} · Est. CNC Cycle: ${telemetry.cncHours} hr`
              }
            ]);
          }
          notify(`AI Co-Pilot applied ${synth.code}`);
        } catch (_err) {
          setAiMessages((prev) => [
            ...prev,
            { role: 'assistant', text: 'Deterministic CAD synthesizer applied parametric updates to the 3D bench.' }
          ]);
        } finally {
          setAiLoading(false);
        }
      };

      const subsystems = SUBSYSTEMS_BY_DOMAIN[domain] || [];
      const activeBoltInfo = SBC350_17_BOLT_SEQUENCE.find((b) => b.seq === boltSequenceStep) || SBC350_17_BOLT_SEQUENCE[0];

      // Concept builds + Active BOM keep the original three-way source; the real
      // library tabs (models / engines / transmissions / parts) use their own memos below.
      const activeSourceList = useMemo(() => {
        if (libTab === 'concept') return matrixSubTab === 'accessories' ? ACCESSORIES_CATALOG : VEHICLE_MATRIX_LIBRARY;
        if (libTab === 'active') return activeMatrixItems;
        return [];
      }, [libTab, matrixSubTab, activeMatrixItems]);

      const filteredMatrix = useMemo(() => {
        const q = matrixSearch.trim().toLowerCase();
        return activeSourceList.filter((item) => {
          const catOk = matrixCategory === 'ALL' || item.category === matrixCategory;
          const statusOk = matrixStatusFilter === 'ALL' || item.status === matrixStatusFilter;
          const idCode = (item.code || item.sku || '').toLowerCase();
          const searchOk =
            !q ||
            item.name.toLowerCase().includes(q) ||
            idCode.includes(q) ||
            (item.engineSpec || '').toLowerCase().includes(q) ||

                        className="w-full min-h-[44px] px-4 rounded-lg bg-emerald-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
                      >
                        ↑ Select Reference Photo (PNG / JPG / WEBP)
                      </button>

                      <div className="p-3 rounded-lg bg-[#070A10] border border-slate-800 space-y-2 text-xs">
                        <div className="flex justify-between">
                          <span className="text-slate-400">Known Span (in)</span>
                          <span className="font-mono-tabular text-sky-300">{calibratedPhoto.knownSpanIn.toFixed(2)} in</span>
                        </div>
                        <input
                          type="range"
                          min="2"
                          max="48"
                          step="0.5"
                          value={calibratedPhoto.knownSpanIn}
                          onChange={(e) =>
                            setCalibratedPhoto((p) => ({ ...p, knownSpanIn: parseFloat(e.target.value) || 14 }))
                          }
                          className="w-full h-3 accent-sky-400 cursor-pointer"
                        />

                        <div className="flex justify-between pt-1">
                          <span className="text-slate-400">3D Overlay Opacity</span>
                          <span className="font-mono-tabular text-amber-300">{Math.round(calibratedPhoto.opacity * 100)}%</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="1"
                          step="0.05"
                          value={calibratedPhoto.opacity}
                          onChange={(e) =>
                            setCalibratedPhoto((p) => ({
                              ...p,
                              opacity: parseFloat(e.target.value) || 0,
                              visible: true
                            }))
                          }
                          className="w-full h-3 accent-amber-400 cursor-pointer"
                        />
                      </div>
                    </div>
                  )}

                  {/* ROOM 6: ASME Y14.5M-2018 & ISO 2768-m 4-VIEW BLUEPRINT */}
                  {activeRoom === 'blueprint' && (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                        <h2 className="text-sm font-bold uppercase tracking-wider text-sky-400">
                          ASME Y14.5M-2018 &amp; ISO 2768-m Sheet
                        </h2>
                        <span className="font-mono-tabular text-xs text-emerald-400">4-VIEW + 2:1 BORE</span>
                      </div>

                      <AsmeTechnicalBlueprint
                        domain={domain}
                        params={params}
                        units={units}
                        sliceAxis={sliceAxis}
                        slicePercent={slicePercent}
                        telemetry={telemetry}
                        titleMeta={titleMeta}
                        svgRef={blueprintSvgRef}
                      />

                      <div className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 space-y-1 text-[11px] font-mono-tabular">
                        <div className="text-amber-300 font-bold">17-BOLT SEQUENCE (#1 → #17 — NOT A CIRCLE):</div>
                        <div className="text-slate-300">
                          Order: {SBC350_17_BOLT_SEQUENCE.map((b) => b.label).join(' → ')}
                        </div>
                        <div className="text-emerald-300">
                          Passes: 25 lb-ft → 45 lb-ft → 65 lb-ft (or 70 lb-ft ARP stud spec)
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div>
                          <label className="block text-[10px] font-mono-tabular text-slate-400 mb-1">DWG NUMBER</label>
                          <input
                            type="text"
                            value={titleMeta.drawingNumber}
                            onChange={(e) => setTitleMeta((t) => ({ ...t, drawingNumber: e.target.value }))}
                            className="w-full min-h-[44px] px-2.5 rounded-lg bg-[#070A10] border border-slate-700 font-mono-tabular text-xs text-slate-100"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-mono-tabular text-slate-400 mb-1">REVISION</label>
                          <input
                            type="text"
                            value={titleMeta.revision}
                            onChange={(e) => setTitleMeta((t) => ({ ...t, revision: e.target.value }))}
                            className="w-full min-h-[44px] px-2.5 rounded-lg bg-[#070A10] border border-slate-700 font-mono-tabular text-xs text-slate-100"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-mono-tabular text-slate-400 mb-1">ENGINEER</label>
                          <input
                            type="text"
                            value={titleMeta.engineer}
                            onChange={(e) => setTitleMeta((t) => ({ ...t, engineer: e.target.value }))}
                            className="w-full min-h-[44px] px-2.5 rounded-lg bg-[#070A10] border border-slate-700 font-mono-tabular text-xs text-slate-100"
                          />
                        </div>
                      </div>

                      <div className="space-y-2">
                        <button
                          type="button"
                          onClick={handleDownloadSvg}
                          className="w-full min-h-[44px] px-4 rounded-lg bg-sky-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
                        >
                          ↓ Download .SVG ASME Y14.5M Blueprint
                        </button>

                        <button
                          type="button"
                          onClick={handleDownloadStl}
                          className="w-full min-h-[44px] px-4 rounded-lg bg-amber-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
                        >
                          ↓ Download .STL 3D Mesh
                        </button>

                        <button
                          type="button"
                          onClick={handleDownloadMbdJson}
                          className="w-full min-h-[44px] px-4 rounded-lg bg-emerald-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
                        >
                          ↓ Download .JSON MBD Specification Packet
                        </button>
                      </div>
                    </div>
                  )}

                  {/* ROOM 8: DRAFTING STUDIO (v2) */}
                  {activeRoom === 'drafting' && (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                        <h2 className="text-sm font-bold uppercase tracking-wider text-sky-400">
                          Drafting Studio — Professional 2D Technical Drawing
                        </h2>
                        <span className="font-mono-tabular text-xs text-emerald-400">SHEET 1 OF 1 · ASME Y14.5M</span>
                      </div>

                      <div className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 text-[11px] text-slate-300 leading-relaxed">
                        Active part:{' '}
                        <span className="font-bold text-sky-300">{activePart ? activePart.name : '—'}</span>
                        {' '}· Source: {activePart ? activePart.source : '—'} · {activePart ? activePart.verification : ''}
                        {!activePart?.hasMesh && (
                          <span className="block mt-1 font-mono-tabular text-amber-300 font-bold">
                            PARAMETERS ONLY — NO MESH: this entry carries parameters, not geometry. The 3D bench still shows the last loaded mesh.
                          </span>
                        )}
                      </div>

                      <DraftingStudioSheet
                        activePart={activePart}
                        params={params}
                        deckHeightIn={deckHeightIn}
                        units={units}
                        titleMeta={titleMeta}
                        svgRef={draftingSvgRef}
                      />

                      <div className="p-3 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
                        <div className="text-[11px] font-mono-tabular font-bold text-sky-300 uppercase">
                          Edit dimensions — updates the 3D bench (one source of truth)
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                          {[
                            { key: 'boreIn', label: 'Bore Ø (in)', step: 0.005, min: 2.5, max: 7.5, source: activePart?.source || 'UNVERIFIED' },
                            { key: 'strokeIn', label: 'Stroke (in)', step: 0.01, min: 2.8, max: 6.5, source: activePart?.source || 'UNVERIFIED' },
                            { key: 'wallIn', label: 'Wall (in)', step: 0.01, min: 0.12, max: 0.75, source: 'v16 cast-block preset (bench default)' },
                            { key: 'filletIn', label: 'Fillet R (in)', step: 0.01, min: 0.05, max: 0.85, source: 'v16 cast-block preset (bench default)' },
                            { key: 'deckHeightIn', label: 'Deck height (in)', step: 0.005, min: 8.0, max: 9.8, source: activePart?.data?.deckHeight ? (activePart.source || 'UNVERIFIED') : 'Bench value' },
                            { key: 'boltCount', label: 'Bolt count', step: 1, min: 8, max: 36, source: 'SBC 17-position sequence' }
                          ].map((d) => (
                            <div key={d.key}>
                              <label className="block text-[10px] font-mono-tabular text-slate-400 mb-1">{d.label}</label>
                              <input
                                type="number"
                                step={d.step}
                                min={d.min}
                                max={d.max}
                                value={d.key === 'deckHeightIn' ? deckHeightIn : params[d.key]}
                                onChange={(e) => handleDraftingDimChange(d.key, e.target.value)}
                                className="w-full min-h-[44px] px-2.5 rounded-lg bg-[#070A10] border border-slate-700 font-mono-tabular text-xs text-slate-100"
                              />
                              <div className="text-[10px] text-slate-500 mt-0.5">{d.source}</div>
                            </div>
                          ))}
                        </div>
                        <div className="text-[11px] text-slate-400">
                          Tolerance default ±0.005 in unless the source says otherwise · Datum frame A|B|C · Every number carries its source or an UNVERIFIED flag.
                        </div>
                      </div>

                      <button type="button" onClick={handleDownloadDraftingSvg} className="w-full min-h-[44px] px-4 rounded-lg bg-sky-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95">
                        ↓ Download .SVG Drafting Studio Sheet
                      </button>
                    </div>
                  )}

                  {/* ROOM 7: JESSE 24FPS CINEMA STANDARD & GEMINI AI CO-PILOT */}
                  {activeRoom === 'cinema' && (
                    <div className="space-y-3 flex flex-col">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                        <h2 className="text-sm font-bold uppercase tracking-wider text-amber-300">
                          Jesse 24fps Cinema &amp; Gemini AI
                        </h2>
                        <span className="font-mono-tabular text-[11px] text-sky-300">24 FPS · 50MM · 369</span>
                      </div>

                      <div className="p-2.5 rounded-lg bg-amber-500/10 border border-amber-400/40 text-[11px] text-amber-100 leading-relaxed">
                        <span className="font-mono-tabular font-bold text-amber-300">VEO PAYWALLED — FREE ROUTE NOTICE: </span>
                        Veo is paywalled, so no Veo video clip is promised or generated here. Free routes use your real footage or stills with slow zooms / Ken Burns motion at 24 fps.
                      </div>

                      <div className="space-y-1.5">
                        {JESSE_SHOT_TEMPLATES.map((shot) => (
                          <button
                            key={shot.id}
                            type="button"
                            onClick={() => setJesseShotId(shot.id)}
                            className={`w-full min-h-[44px] px-3 py-2 rounded-lg text-left text-xs font-semibold touch-manipulation transition ${
                              jesseShotId === shot.id
                                ? 'bg-sky-400 text-slate-950'
                                : 'bg-[#070A10] text-slate-200 border border-slate-800'
                            }`}
                          >
                            {shot.title}
                          </button>
                        ))}
                      </div>

                      <div className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
                        <div className="flex items-center justify-between text-[11px] font-mono-tabular">
                          <span className="text-sky-300 font-bold">24 FPS SLOW-ZOOM PREVIEW ({jesseScrubPct}%)</span>
                          <button
                            type="button"
                            onClick={() => setJessePlaying((p) => !p)}
                            className="min-h-[44px] px-3 rounded-lg bg-slate-900 border border-slate-700 text-xs font-bold text-emerald-300 touch-manipulation"
                          >
                            {jessePlaying ? '❚❚ Pause 24fps' : '▶ Play 24fps'}
                          </button>
                        </div>

                        <div className="relative h-36 w-full overflow-hidden rounded-lg border border-slate-700 bg-[#050810] flex items-center justify-center">
                          <div
                            style={{
                              transform: `scale(${(1 + (jesseScrubPct / 100) * 0.16).toFixed(3)})`,
                              filter: `${jesseWarmGoldGrade ? 'sepia(0.28) contrast(1.06) ' : ''}${jesseFineGrain ? 'saturate(1.12)' : ''}`
                            }}
                            className="w-full h-full flex flex-col items-center justify-center p-3 text-center transition-transform duration-75"
                          >
                            {jesseSourceMediaUrl ? (
                              <img
                                src={jesseSourceMediaUrl}
                                alt={jesseSourceMediaName || 'Still / Footage Frame'}
                                className="w-full h-full object-cover rounded"
                              />
                            ) : (
                              <>
                                <div className="font-mono-tabular text-[11px] font-bold text-amber-300">
                                  EMBLEM OPEN → 369 CLOSE · 50MM SHARP / SOFT BG
                                </div>
                                <div className="text-xs text-slate-200 mt-1">
                                  {activeJesseShot.move} · {activeJesseShot.lighting}
                                </div>
                                <div className="font-mono-tabular text-[10px] text-sky-300 mt-1">
                                  BAND TOGETHER IN ONE LIVE SCENE · NO MORPHING
                                </div>
                              </>
                            )}
                          </div>
                        </div>

                        <input
                          type="range"
                          min="0"
                          max="100"
                          step="0.5"
                          value={jesseScrubPct}
                          onChange={(e) => setJesseScrubPct(parseFloat(e.target.value) || 0)}
                          className="w-full h-3 accent-sky-400 cursor-pointer"
                        />

                        <div className="grid grid-cols-2 gap-1.5">
                          <button
                            type="button"
                            onClick={() => setJesseWarmGoldGrade((g) => !g)}
                            className={`min-h-[44px] px-2 rounded-lg font-mono-tabular text-[11px] font-bold touch-manipulation ${
                              jesseWarmGoldGrade
                                ? 'bg-amber-400 text-slate-950'
                                : 'bg-slate-900 text-slate-300 border border-slate-700'
                            }`}
                          >
                            Warm Gold: {jesseWarmGoldGrade ? 'ON' : 'OFF'}
                          </button>
                          <button
                            type="button"
                            onClick={() => setJesseFineGrain((g) => !g)}
                            className={`min-h-[44px] px-2 rounded-lg font-mono-tabular text-[11px] font-bold touch-manipulation ${
                              jesseFineGrain
                                ? 'bg-sky-400 text-slate-950'
                                : 'bg-slate-900 text-slate-300 border border-slate-700'
                            }`}
                          >
                            Fine Grain: {jesseFineGrain ? 'ON' : 'OFF'}
                          </button>
                        </div>

                        <label className="w-full min-h-[44px] px-3 rounded-lg bg-slate-900 border border-slate-700 font-mono-tabular text-xs font-semibold text-emerald-300 flex items-center justify-center cursor-pointer touch-manipulation">
                          ↑ Load Still / Footage for Free Slow Zoom
                          <input
                            type="file"
                            accept="image/*,video/*"
                            className="hidden"
                            onChange={(e) => {
                              const f = e.target.files && e.target.files[0];
                              if (!f) return;
                              const nextUrl = URL.createObjectURL(f);
                              if (prevJesseMediaUrlRef.current) URL.revokeObjectURL(prevJesseMediaUrlRef.current);
                              prevJesseMediaUrlRef.current = nextUrl;
                              setJesseSourceMediaUrl(nextUrl);
                              setJesseSourceMediaName(f.name);
                              e.target.value = '';
                              notify(`Loaded still/footage: ${f.name}`);
                            }}
                          />
                        </label>
                      </div>

                      <div className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
                        <div className="text-[11px] font-mono-tabular text-sky-300 font-bold">
                          JESSE STANDARD PROMPT (24 FPS · 50MM · 369)
                        </div>
                        <p className="text-[11px] text-slate-200 leading-relaxed select-text">
                          {composedJessePrompt}
                        </p>
                        <button
                          type="button"
                          onClick={() => {
                            try {
                              if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(composedJessePrompt).catch(() => {});
                              }
                            } catch (_e) {}
                            notify('Copied Jesse 24fps Standard Prompt');
                          }}
                          className="w-full min-h-[44px] px-3 rounded-lg bg-sky-400 text-slate-950 font-mono-tabular text-xs font-bold touch-manipulation active:scale-95"
                        >
                          Copy Jesse Standard Prompt
                        </button>
                      </div>

                      <input
                        type="password"
                        value={geminiApiKey}
                        onChange={(e) => setGeminiApiKey(e.target.value)}
                        placeholder="Optional Gemini API Key (works offline too)..."
                        className="w-full min-h-[44px] px-3 rounded-lg bg-[#070A10] border border-slate-700 font-mono-tabular text-xs text-slate-200 focus:outline-none focus:border-sky-400"
                      />

                      <div className="min-h-[140px] max-h-[210px] overflow-y-auto space-y-2 p-2.5 rounded-lg bg-[#070A10] border border-slate-800">
                        {aiMessages.map((msg, i) => (
                          <div
                            key={i}
                            className={`p-2 rounded-lg text-xs whitespace-pre-line leading-relaxed ${
                              msg.role === 'user'
                                ? 'bg-sky-500/15 border border-sky-400/40 text-sky-100 ml-4'
                                : 'bg-[#0E1420] border border-slate-800 text-slate-200 mr-3'
                            }`}
                          >
                            {msg.text}
                          </div>
                        ))}
                        {aiLoading && (
                          <div className="text-xs font-mono-tabular text-amber-300 animate-pulse">
                            Synthesizing CAD &amp; 24fps shot specs...
                          </div>
                        )}
                      </div>

                      <form
                        onSubmit={(e) => {
                          e.preventDefault();
                          handleAskCoPilot();
                        }}
                        className="flex gap-2"
                      >
                        <input
                          type="text"
                          value={aiPrompt}
                          onChange={(e) => setAiPrompt(e.target.value)}
                          placeholder="Ask Gemini Co-Pilot to tune part or shot..."
                          className="flex-1 min-h-[44px] px-3 rounded-lg bg-[#070A10] border border-slate-700 text-xs text-slate-100 focus:outline-none focus:border-sky-400"
                        />
                        <button
                          type="submit"
                          disabled={aiLoading}
                          className="min-h-[44px] px-4 rounded-lg bg-sky-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95 disabled:opacity-50"
                        >
                          Generate
                        </button>
                      </form>
                    </div>
                  )}
                </aside>
              )}
            </div>

            {/* =============================================================== */}
            {/* 4. STANDARDS, ALLOYS & TORQUE SEQUENCES MODAL                   */}
            {/* =============================================================== */}
            {standardsOpen && (
              <div
                onClick={() => setStandardsOpen(false)}
                className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="w-full max-w-3xl max-h-[86vh] overflow-y-auto rounded-xl bg-[#0E1420] border border-slate-700 p-5 space-y-4 shadow-2xl"
                >
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h3 className="text-sm font-bold uppercase tracking-wider text-sky-400">
                        ASME Y14.5-2018 Tolerances, Alloys &amp; Torque Schedules
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Quantum Aerospace &amp; SBC-350 v16/v20 Merged CAD &amp; Manufacturing Studio
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setStandardsOpen(false)}
                      className="min-h-[44px] min-w-[44px] px-3 rounded-lg bg-slate-900 border border-slate-700 text-xs font-bold text-slate-200 touch-manipulation"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-bold text-amber-300 uppercase">GD&amp;T &amp; Manufacturing Standards</div>
                    {TOLERANCE_STANDARDS.map((t) => (
                      <div key={t.code} className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 text-xs">
                        <span className="font-mono-tabular text-sky-300 font-bold">{t.code}:</span>{' '}
                        <span className="text-slate-300">{t.spec}</span>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-bold text-sky-300 uppercase">Torque Pass Schedules</div>
                    {TORQUE_SEQUENCES.map((tq) => (
                      <div key={tq.assembly} className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 text-xs">
                        <div className="font-bold text-slate-100">{tq.assembly} ({tq.pattern})</div>
                        <div className="font-mono-tabular text-[11px] text-amber-200 mt-0.5">{tq.passes}</div>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-bold text-emerald-300 uppercase">Alloys &amp; Thermal Specs</div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {ALLOYS.map((a) => (
                        <div key={a.id} className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 text-xs font-mono-tabular">
                          <div className="font-sans font-bold text-slate-100">{a.name}</div>
                          <div className="text-[11px] text-slate-400 mt-1">
                            ρ: {a.densityLbIn3} lb/in³ · σy: {a.yieldMPa} MPa · Tmax: {a.maxTempC}°C
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {toast && (
              <div className="fixed bottom-12 left-4 z-50 px-4 py-2.5 rounded-lg bg-[#151E30] border border-sky-400/70 text-xs font-mono-tabular text-sky-200 shadow-2xl">
                {toast}
              </div>
            )}
          </div>
        </StudioErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudioApp />);
  </script>
</body>
</html>
