    function createStudioEnvironmentTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;

      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.0, '#1e293b');
      grad.addColorStop(0.45, '#0f172a');
      grad.addColorStop(0.55, '#090d16');
      grad.addColorStop(1.0, '#162032');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      ctx.fillStyle = 'rgba(255, 224, 178, 0.85)';
      ctx.fillRect(290, 28, 130, 34);

      ctx.fillStyle = 'rgba(125, 211, 252, 0.72)';
      ctx.fillRect(72, 48, 115, 28);

      ctx.fillStyle = 'rgba(241, 245, 249, 0.45)';
      ctx.fillRect(195, 16, 82, 14);

      const envTex = new THREE.CanvasTexture(canvas);
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      envTex.colorSpace = THREE.SRGBColorSpace;
      return envTex;

    function createSimpleOrbitController(camera, domElement, initialTarget) {
      const target = initialTarget ? initialTarget.clone() : new THREE.Vector3(0, 0.2, 0);
      const offset = camera.position.clone().sub(target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      let isDragging = false;
      let dragMode = 'ROTATE';
      let lastX = 0;
      let lastY = 0;
      let lastPinchDist = null;
      let dampingTheta = 0;
      let dampingPhi = 0;

      const syncFromCamera = () => {
        offset.copy(camera.position).sub(target);
        spherical.setFromVector3(offset);
        spherical.radius = THREE.MathUtils.clamp(spherical.radius, 2.2, 26.0);
        spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.12, Math.PI - 0.12);
      };

      const applySpherical = () => {
        spherical.radius = THREE.MathUtils.clamp(spherical.radius, 2.2, 26.0);
        spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.12, Math.PI - 0.12);
        offset.setFromSpherical(spherical);
        camera.position.copy(target).add(offset);
        camera.lookAt(target);
      };

      const onMouseDown = (e) => {
        isDragging = true;
        dragMode = (e.button === 2 || e.shiftKey) ? 'PAN' : 'ROTATE';
        lastX = e.clientX;
        lastY = e.clientY;
        dampingTheta = 0;
        dampingPhi = 0;
      };

      const onMouseMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        if (dragMode === 'ROTATE') {
          const rotSpeed = 0.0065;
          dampingTheta = -dx * rotSpeed;
          dampingPhi = -dy * rotSpeed;
          spherical.theta += dampingTheta;
          spherical.phi += dampingPhi;
          applySpherical();
        } else {
          const panScale = spherical.radius * 0.0014;
          const forward = target.clone().sub(camera.position).normalize();
          const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
          const up = new THREE.Vector3().crossVectors(right, forward).normalize();
          target.addScaledVector(right, -dx * panScale);
          target.addScaledVector(up, dy * panScale);
          applySpherical();
        }
      };

      const onMouseUp = () => {
        isDragging = false;
      };

      const onWheel = (e) => {
        e.preventDefault();
        syncFromCamera();
        const scale = e.deltaY > 0 ? 1.1 : 0.9;
        spherical.radius *= scale;
        applySpherical();
      };

      const onTouchStart = (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          dragMode = 'ROTATE';
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          lastPinchDist = null;
        } else if (e.touches.length === 2) {
          isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastPinchDist = Math.hypot(dx, dy);
        }
      };

      const onTouchMove = (e) => {
        if (e.touches.length === 1 && isDragging) {
          const dx = e.touches[0].clientX - lastX;
          const dy = e.touches[0].clientY - lastY;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          spherical.theta -= dx * 0.007;
          spherical.phi -= dy * 0.007;
          applySpherical();
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (lastPinchDist && dist > 0) {
            syncFromCamera();
            spherical.radius *= lastPinchDist / dist;
            applySpherical();
          }
          lastPinchDist = dist;
        }
      };

      const onTouchEnd = () => {
        isDragging = false;
        lastPinchDist = null;
      };

      const onContextMenu = (e) => e.preventDefault();

      domElement.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      domElement.addEventListener('wheel', onWheel, { passive: false });
      domElement.addEventListener('touchstart', onTouchStart, { passive: true });
      domElement.addEventListener('touchmove', onTouchMove, { passive: true });
      domElement.addEventListener('touchend', onTouchEnd);
      domElement.addEventListener('contextmenu', onContextMenu);

      applySpherical();

      return {
        target,
        syncFromCamera,
        setView: (posVec, nextTarget) => {
          if (nextTarget) target.copy(nextTarget);
          camera.position.copy(posVec);
          syncFromCamera();
          applySpherical();
        },
        zoomBy: (factor) => {
          syncFromCamera();
          spherical.radius *= factor;
          applySpherical();
        },
        update: () => {
          if (!isDragging && (Math.abs(dampingTheta) > 0.0001 || Math.abs(dampingPhi) > 0.0001)) {
            spherical.theta += dampingTheta;
            spherical.phi += dampingPhi;
            dampingTheta *= 0.88;
            dampingPhi *= 0.88;
            applySpherical();
          }
        },
        dispose: () => {
          domElement.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          domElement.removeEventListener('wheel', onWheel);
          domElement.removeEventListener('touchstart', onTouchStart);
          domElement.removeEventListener('touchmove', onTouchMove);
          domElement.removeEventListener('touchend', onTouchEnd);
          domElement.removeEventListener('contextmenu', onContextMenu);
        }
      };
    }

    function createBrushedMetalTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#c9d2de';
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y++) {
        const shade = 180 + ((y * 37) % 48);
        ctx.fillStyle = `rgb(${shade},${shade + 4},${shade + 10})`;
        ctx.fillRect(0, y, 256, 1);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function createCarbonWeaveTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 64, 64);
      for (let y = 0; y < 64; y += 8) {
        for (let x = 0; x < 64; x += 8) {
          ctx.fillStyle = ((x + y) / 8) % 2 === 0 ? '#1e293b' : '#334155';
          ctx.fillRect(x, y, 7, 3);
          ctx.fillStyle = '#090d16';
          ctx.fillRect(x, y + 4, 7, 3);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(10, 10);
      return tex;
    }

    function disposeObject3D(root) {
      if (!root) return;
      root.traverse((node) => {
        if (node.geometry) node.geometry.dispose();
        if (node.material) {
          const list = Array.isArray(node.material) ? node.material : [node.material];
          list.forEach((m) => {
            if (m.map) m.map.dispose();
            if (m.envMap) m.envMap.dispose();
            m.dispose();
          });
        }
      });
    }

    function applyFeaVertexColors(geometry) {
      const pos = geometry.attributes.position;
      if (!pos) return;
      geometry.computeBoundingBox();
      const bb = geometry.boundingBox;
      const minY = bb ? bb.min.y : -1;
      const maxY = bb ? bb.max.y : 1;
      const spanY = Math.max(0.001, maxY - minY);
      const colors = new Float32Array(pos.count * 3);
      const color = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const stress = THREE.MathUtils.clamp(
          ((y - minY) / spanY) * 0.62 + (Math.abs(x) + Math.abs(z)) * 0.08,
          0,
          1
        );
        color.setHSL(0.62 - stress * 0.60, 0.92, 0.52);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }

    function parseAsciiStlToGeometry(text) {
      const vertices = [];
      const vertexRegex = /vertex\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)/g;
      let match;
      while ((match = vertexRegex.exec(text)) !== null) {
        vertices.push(parseFloat(match[1]), parseFloat(match[2]), parseFloat(match[3]));
      }
      if (vertices.length < 9) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function parseObjToGeometry(text) {
      const rawVerts = [];
      const triVerts = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('v ')) {
          const parts = trimmed.split(/\s+/);
          if (parts.length >= 4) {
            rawVerts.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
          }
        } else if (trimmed.startsWith('f ')) {
          const parts = trimmed.slice(2).trim().split(/\s+/);
          const idxList = parts
            .map((tok) => {
              const vIdx = parseInt(tok.split('/')[0], 10);
              return vIdx < 0 ? rawVerts.length + vIdx : vIdx - 1;
            })
            .filter((idx) => idx >= 0 && idx < rawVerts.length);
          for (let i = 1; i + 1 < idxList.length; i++) {
            const a = rawVerts[idxList[0]];
            const b = rawVerts[idxList[i]];
            const c = rawVerts[idxList[i + 1]];
            triVerts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
          }
        }
      }
      if (triVerts.length < 9) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(triVerts, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function exportGroupToAsciiStl(group, solidName) {
      const lines = [`solid ${solidName}`];
      const vA = new THREE.Vector3();
      const vB = new THREE.Vector3();
      const vC = new THREE.Vector3();
      const cb = new THREE.Vector3();
      const ab = new THREE.Vector3();

      group.updateMatrixWorld(true);
      group.traverse((obj) => {
        if (!obj.isMesh || !obj.visible || !obj.geometry) return;
        const geo = obj.geometry;
        const pos = geo.attributes.position;
        if (!pos) return;
        const index = geo.index;
        const triCount = index ? index.count / 3 : pos.count / 3;

        for (let t = 0; t < triCount; t++) {
          const i0 = index ? index.getX(t * 3) : t * 3;
          const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
          const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;

          vA.fromBufferAttribute(pos, i0).applyMatrix4(obj.matrixWorld);
          vB.fromBufferAttribute(pos, i1).applyMatrix4(obj.matrixWorld);
          vC.fromBufferAttribute(pos, i2).applyMatrix4(obj.matrixWorld);

          cb.subVectors(vC, vB);
          ab.subVectors(vA, vB);
          cb.cross(ab).normalize();

          lines.push(`  facet normal ${cb.x.toFixed(6)} ${cb.y.toFixed(6)} ${cb.z.toFixed(6)}`);
          lines.push('    outer loop');
          lines.push(`      vertex ${vA.x.toFixed(6)} ${vA.y.toFixed(6)} ${vA.z.toFixed(6)}`);
          lines.push(`      vertex ${vB.x.toFixed(6)} ${vB.y.toFixed(6)} ${vB.z.toFixed(6)}`);
          lines.push(`      vertex ${vC.x.toFixed(6)} ${vC.y.toFixed(6)} ${vC.z.toFixed(6)}`);
          lines.push('    endloop');
          lines.push('  endfacet');
        }
      });
      lines.push(`endsolid ${solidName}`);
      return lines.join('\n');
    }

      const explodeAnimRef = useRef({ from: explodePercent, to: explodePercent, elapsed: 1, duration: 1.0 });
      const sliceAnimRef = useRef({ from: slicePercent, to: slicePercent, elapsed: 1, duration: 1.0 });

      useEffect(() => {
        explodeAnimRef.current = {
          from: easedExplodeRef.current,
          to: explodePercent,
          elapsed: 0,
          duration: 1.0
        };
      }, [explodePercent]);

      useEffect(() => {
        sliceAnimRef.current = {
          from: easedSliceRef.current,
          to: slicePercent,
          elapsed: 0,
          duration: 1.0
        };
      }, [slicePercent]);

      const animStateRef = useRef({
        turntableSpin,
        turntableSec: THREE.MathUtils.clamp(turntableSec || 9, 6, 12),
        mechanicalMotion,
        domain,
        renderMode,
        sliceAxis,
        params
      });
      useEffect(() => {
        animStateRef.current = {
          turntableSpin,
          turntableSec: THREE.MathUtils.clamp(turntableSec || 9, 6, 12),
          mechanicalMotion,
          domain,
          renderMode,
          sliceAxis,
          params
        };
      }, [turntableSpin, turntableSec, mechanicalMotion, domain, renderMode, sliceAxis, params]);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const w = Math.max(300, container.clientWidth || 680);
        const h = Math.max(300, container.clientHeight || 460);

        let webglReady = false;
        let renderer = null;
        let scene = null;
        let camera = null;
        let orbit = null;
        let envTex = null;

        try {
          if (typeof THREE === 'undefined' || !THREE.WebGLRenderer) {

          scene = new THREE.Scene();
          sceneRef.current = scene;

          envTex = createStudioEnvironmentTexture();
          envTexRef.current = envTex;
          scene.environment = envTex;
          scene.environmentIntensity = 0.85;

          camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 180);
          camera.position.set(7.2, 5.2, 7.6);
          cameraRef.current = camera;

          renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            preserveDrawingBuffer: true,
            powerPreference: 'high-performance'
          });
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.08;
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.localClippingEnabled = true;
          rendererRef.current = renderer;
          container.appendChild(renderer.domElement);

          orbit = createSimpleOrbitController(camera, renderer.domElement, new THREE.Vector3(0, 0.25, 0));
          orbitRef.current = orbit;

          const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x0f172a, 0.55);

          const warmKeyLight = new THREE.DirectionalLight(0xffdfa8, 2.6);

          const coolRimLight = new THREE.DirectionalLight(0x7dd3fc, 1.15);
          coolRimLight.position.set(-11, 6, -9);
          scene.add(coolRimLight);

          const grid = new THREE.GridHelper(18, 36, 0x283b5c, 0x101827);
          grid.position.y = -2.05;
          scene.add(grid);

          const axes = new THREE.AxesHelper(1.75);
          axes.position.set(-6.2, -2.02, -6.2);
          scene.add(axes);

          const capGeo = new THREE.PlaneGeometry(7.2, 7.2);
          const capMat = new THREE.MeshBasicMaterial({
            color: 0xf59e0b,
            transparent: true,
            opacity: 0.14,

            depthWrite: false
          });
          const capMesh = new THREE.Mesh(capGeo, capMat);
          capMesh.visible = false;

          webglReady = true;
          if (onDiagnosticsUpdate) {
            onDiagnosticsUpdate({ rendererMode: 'WebGL2 ACES (40°)', fps: 60, meshCount: 0 });
          }
        } catch (_err) {
          webglReady = false;
          const fallbackCanvas = document.createElement('canvas');

          fallbackCanvas.height = h;
          fallbackCanvas.className = 'w-full h-full block';

          if (onDiagnosticsUpdate) {
            onDiagnosticsUpdate({ rendererMode: 'Fallback 2D Canvas', fps: 60, meshCount: 12 });

        const resizeObserver = new ResizeObserver(() => {
          if (!containerRef.current) return;
          const nw = Math.max(260, containerRef.current.clientWidth);
          const nh = Math.max(240, containerRef.current.clientHeight);
          if (webglReady && rendererRef.current && cameraRef.current) {
            cameraRef.current.aspect = nw / nh;
            cameraRef.current.updateProjectionMatrix();
            rendererRef.current.setSize(nw, nh);
          } else if (fallback2dCanvasRef.current) {
            fallback2dCanvasRef.current.width = nw;
            fallback2dCanvasRef.current.height = nh;
          }
        });
        resizeObserver.observe(container);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        const onPointerDown = (e) => {
          downPos = { x: e.clientX, y: e.clientY };
        };

        const onPointerUp = (e) => {
          if (!webglReady || !renderer || !camera || !assemblyRootRef.current) return;
          const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
          if (dist > 6) return;
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(assemblyRootRef.current.children, true);
          const hitMesh = hits.find((h) => h.object && h.object.visible && h.object.userData.subsystem);
          if (hitMesh && onSelectSubsystem) {
            onSelectSubsystem(hitMesh.object.userData.subsystem);
          }
        };

        if (webglReady && renderer) {
          renderer.domElement.addEventListener('pointerdown', onPointerDown);
          renderer.domElement.addEventListener('pointerup', onPointerUp);
        }

        const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

        let frameId = null;
        let prevTime = performance.now();
        let simTime = 0;
        let framesSinceSample = 0;
        let lastFpsSample = prevTime;

        const animate = (now) => {
          frameId = requestAnimationFrame(animate);
          const rawDt = (now - prevTime) / 1000;
          prevTime = now;
          const dt = Math.min(0.05, Math.max(0.001, rawDt));

          const {
            turntableSpin: spin,
            turntableSec: spinPeriod,
            mechanicalMotion: motion,
            sliceAxis: curAxis
          } = animStateRef.current;

          framesSinceSample++;
          if (now - lastFpsSample >= 750) {
            const measuredFps = Math.max(15, Math.min(120, Math.round((framesSinceSample * 1000) / (now - lastFpsSample))));
            let count = 0;
            if (assemblyRootRef.current) {
              assemblyRootRef.current.traverse((o) => {
                if (o.isMesh && o.visible) count++;
              });
            }
            if (onDiagnosticsUpdate) {
              onDiagnosticsUpdate({
                rendererMode: webglReady ? 'WebGL2 ACES (40°)' : 'Fallback 2D Canvas',
                fps: measuredFps,
                meshCount: webglReady ? count : 14
              });
            }
            framesSinceSample = 0;
            lastFpsSample = now;
          }

          const expAnim = explodeAnimRef.current;
          if (expAnim.elapsed < expAnim.duration) {
            expAnim.elapsed = Math.min(expAnim.duration, expAnim.elapsed + dt);
            const k = easeInOutCubic(expAnim.elapsed / expAnim.duration);
            easedExplodeRef.current = expAnim.from + (expAnim.to - expAnim.from) * k;
          } else {
            easedExplodeRef.current = expAnim.to;
          }

          const slcAnim = sliceAnimRef.current;
          if (slcAnim.elapsed < slcAnim.duration) {
            slcAnim.elapsed = Math.min(slcAnim.duration, slcAnim.elapsed + dt);
            const k = easeInOutCubic(slcAnim.elapsed / slcAnim.duration);
            easedSliceRef.current = slcAnim.from + (slcAnim.to - slcAnim.from) * k;
          } else {
            easedSliceRef.current = slcAnim.to;
          }

          const curExplode = easedExplodeRef.current;
          const curSlice = easedSliceRef.current;

          if (webglReady && renderer && scene && camera) {
            if (assemblyRootRef.current && spin) {
              const radPerSec = (Math.PI * 2) / THREE.MathUtils.clamp(spinPeriod, 6, 12);
              assemblyRootRef.current.rotation.y += radPerSec * dt;
            }

            const expFactor = curExplode / 100;
            Object.values(subsystemGroupsRef.current).forEach((grp) => {
              if (!grp || !grp.userData.explodeVec) return;
              const v = grp.userData.explodeVec;
              grp.position.set(v.x * expFactor, v.y * expFactor, v.z * expFactor);
            });

            const activeSlice = curSlice > 0.1;
            const cutWorld = activeSlice ? 3.8 * (1 - (curSlice / 100) * 1.85) : 999;
            clipPlaneRef.current.constant = cutWorld;
            if (sectionCapRef.current) {
              sectionCapRef.current.visible = activeSlice;
              if (curAxis === 'X') sectionCapRef.current.position.set(cutWorld, 0, 0);
              else if (curAxis === 'Y') sectionCapRef.current.position.set(0, cutWorld, 0);
              else sectionCapRef.current.position.set(0, 0, cutWorld);
            }

            if (motion) {
              simTime += dt * 4.2;
              const anim = animatedPartsRef.current;
              if (anim.crank) {
                anim.crank.rotation.x = simTime;
              }
              anim.pistons.forEach((pMesh, idx) => {
                const phase = simTime + (idx % 4) * (Math.PI / 2) + (idx >= 4 ? Math.PI / 4 : 0);
                const strokeOffset = Math.sin(phase) * 0.22;
                const bankSign = idx < 4 ? 1 : -1;
                pMesh.position.y = pMesh.userData.baseY + strokeOffset * 0.707;
                pMesh.position.z = pMesh.userData.baseZ + bankSign * strokeOffset * 0.707;
              });
              anim.valves.forEach((vMesh, idx) => {
                const lift = Math.max(0, Math.sin(simTime * 0.5 + idx * 0.8)) * 0.09;
                vMesh.position.y = vMesh.userData.baseY - lift;
              });
              anim.turbopumps.forEach((tp, idx) => {
                tp.rotation.z = simTime * (idx === 0 ? 2.4 : -2.4);
              });
            }

            if (orbit) orbit.update();
            renderer.render(scene, camera);
          } else if (fallback2dCanvasRef.current) {
            const c2d = fallback2dCanvasRef.current;
            const ctx = c2d.getContext('2d');
            if (ctx) {
              simTime += motion ? dt * 2.5 : 0;
              ctx.clearRect(0, 0, c2d.width, c2d.height);
              ctx.strokeStyle = '#38BDF8';
              ctx.lineWidth = 2;
              const cx = c2d.width / 2;
              const cy = c2d.height / 2;
              const r = 90 + (curExplode / 100) * 35;
              ctx.strokeRect(cx - r, cy - r * 0.65, r * 2, r * 1.3);
              ctx.beginPath();
              ctx.arc(cx + Math.cos(simTime) * 28, cy + Math.sin(simTime) * 18, 28, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
        };
        frameId = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(frameId);
          resizeObserver.disconnect();
          if (webglReady && renderer) {
            renderer.domElement.removeEventListener('pointerdown', onPointerDown);
            renderer.domElement.removeEventListener('pointerup', onPointerUp);
          }
          if (orbit) orbit.dispose();
          disposeObject3D(assemblyRootRef.current);
          disposeObject3D(photoMeshRef.current);
          if (envTex) envTex.dispose();
          if (renderer) renderer.dispose();
          if (renderer && renderer.domElement && renderer.domElement.parentNode === container) {
            container.removeChild(renderer.domElement);
          }
          if (fallback2dCanvasRef.current && fallback2dCanvasRef.current.parentNode === container) {
            container.removeChild(fallback2dCanvasRef.current);
          }
        };
      }, [onSelectSubsystem, onDiagnosticsUpdate]);

      useEffect(() => {
        if (!cameraCommand || !cameraRef.current || !orbitRef.current) return;
        const cam = cameraRef.current;
        const orb = orbitRef.current;
        const dist = 8.2;

        if (cameraCommand.type === 'PRESET') {
          if (cameraCommand.preset === 'ISO') orb.setView(new THREE.Vector3(dist * 0.86, dist * 0.64, dist * 0.90), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'TOP') orb.setView(new THREE.Vector3(0, dist * 1.25, 0.01), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'FRONT') orb.setView(new THREE.Vector3(0, dist * 0.22, dist * 1.22), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'RIGHT') orb.setView(new THREE.Vector3(dist * 1.22, dist * 0.22, 0), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'SECTION') orb.setView(new THREE.Vector3(dist * 0.95, dist * 0.42, dist * 0.45), new THREE.Vector3(0, 0.25, 0));
          cam.updateProjectionMatrix();
        } else if (cameraCommand.type === 'ZOOM') {
          orb.zoomBy(cameraCommand.factor);
        }
      }, [cameraCommand]);

      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        if (assemblyRootRef.current) {
          scene.remove(assemblyRootRef.current);
          disposeObject3D(assemblyRootRef.current);
          assemblyRootRef.current = null;
        }
        subsystemGroupsRef.current = {};
        animatedPartsRef.current = { crank: null, pistons: [], valves: [], turbopumps: [] };

        const plane = clipPlaneRef.current;
        const cap = sectionCapRef.current;
        const activeSlice = slicePercent > 0;
        const cutWorld = activeSlice ? 3.8 * (1 - (slicePercent / 100) * 1.85) : 999;

        if (sliceAxis === 'X') {
          plane.normal.set(-1, 0, 0);
          if (cap) {
            cap.position.set(cutWorld, 0, 0);
            cap.rotation.set(0, Math.PI / 2, 0);
          }
        } else if (sliceAxis === 'Y') {
          plane.normal.set(0, -1, 0);
          if (cap) {
            cap.position.set(0, cutWorld, 0);
            cap.rotation.set(Math.PI / 2, 0, 0);
          }
        } else {
          plane.normal.set(0, 0, -1);
          if (cap) {
            cap.position.set(0, 0, cutWorld);
            cap.rotation.set(0, 0, 0);
          }
        }
        plane.constant = cutWorld;
        if (cap) cap.visible = activeSlice;

        const clippingPlanes = activeSlice ? [plane] : [];
        const alloy = ALLOYS.find((a) => a.id === params.materialId) || ALLOYS[0];
        const brushedTex = createBrushedMetalTexture();
        const carbonTex = createCarbonWeaveTexture();

        const buildMaterial = (baseHex, subsystemName, opts = {}) => {
          const isSelected = selectedSubsystem === subsystemName;
          const color = isSelected ? 0x38bdf8 : baseHex;

          if (renderMode === 'wireframe' || renderMode === 'lattice-3dp') {
            return new THREE.MeshBasicMaterial({
              color: renderMode === 'lattice-3dp' ? 0x10b981 : color,
              wireframe: true,
              clippingPlanes
            });
          }
          if (renderMode === 'xray') {
            const isInternal = opts.internal === true;
            return new THREE.MeshBasicMaterial({
              color: isInternal ? 0xf59e0b : color,
              transparent: true,
              opacity: isInternal ? 0.88 : 0.24,
              depthWrite: isInternal,
              side: THREE.DoubleSide,
              clippingPlanes
            });
          }
          if (renderMode === 'fea-field') {
            return new THREE.MeshStandardMaterial({
              vertexColors: true,
              roughness: 0.28,
              metalness: 0.42,
              side: THREE.DoubleSide,
              clippingPlanes
            });
          }

          return new THREE.MeshStandardMaterial({
            color,
            map: opts.carbon ? carbonTex : opts.brushed ? brushedTex : null,
            metalness: opts.metalness !== undefined ? opts.metalness : alloy.metalness,
            roughness: opts.roughness !== undefined ? opts.roughness : alloy.roughness,
            envMapIntensity: 0.9,
            emissive: opts.emissive || 0x000000,
            emissiveIntensity: opts.emissiveIntensity || 0,
            side: THREE.DoubleSide,
            clippingPlanes
          });
        };

        const root = new THREE.Group();

        const createSubGroup = (name, explodeVec) => {
          const g = new THREE.Group();
          g.name = name;
          g.userData.explodeVec = new THREE.Vector3(explodeVec[0], explodeVec[1], explodeVec[2]);
          const hiddenEye = visibilityMap[name] === false;
          const hiddenIso = isolatedSubsystem && isolatedSubsystem !== name;
          g.visible = !hiddenEye && !hiddenIso;
          subsystemGroupsRef.current[name] = g;
          root.add(g);
          return g;
        };

        const addPart = (parent, geo, hex, subsystemName, pos, rot, opts = {}) => {
          if (renderMode === 'fea-field') applyFeaVertexColors(geo);
          const mesh = new THREE.Mesh(geo, buildMaterial(hex, subsystemName, opts));
          mesh.userData.subsystem = subsystemName;
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          if (pos) mesh.position.set(pos[0], pos[1], pos[2]);
          if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
          parent.add(mesh);

          if (renderMode === 'wireframe') {
            const edges = new THREE.EdgesGeometry(geo, 28);
            const line = new THREE.LineSegments(
              edges,
              new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45, clippingPlanes })
            );
            line.position.copy(mesh.position);
            line.rotation.copy(mesh.rotation);
            parent.add(line);
          }
          return mesh;
        };

        const boreScale = THREE.MathUtils.clamp(params.boreIn / 4.0, 0.82, 1.55);
        const strokeScale = THREE.MathUtils.clamp(params.strokeIn / 3.48, 0.85, 1.45);
        const wallScale = THREE.MathUtils.clamp(params.wallIn / 0.28, 0.75, 1.65);

        if (domain === 'sbc-350-v16' || domain === 'sbc-350-v20') {
          const isV20 = domain === 'sbc-350-v20';
          const blockLen = 3.8 * boreScale;
          const blockH = 1.45 * strokeScale;
          const blockW = 1.75 * wallScale;

          const gBlock = createSubGroup('Engine Block & Sump', [0, -0.45, 0]);
          addPart(gBlock, new THREE.BoxGeometry(blockLen, blockH, blockW), alloy.color, 'Engine Block & Sump', [0, 0, 0], null, { brushed: true });

          for (let bankIdx = 0; bankIdx < 2; bankIdx++) {
            const sign = bankIdx === 0 ? 1 : -1;
            for (let c = 0; c < 4; c++) {
              const xOff = ((c - 1.5) / 3) * (blockLen * 0.72) + (bankIdx === 1 ? 0.14 : -0.14);
              const sleeveGeo = new THREE.CylinderGeometry(0.32 * boreScale, 0.32 * boreScale, blockH * 0.92, 24, 1, true);
              addPart(gBlock, sleeveGeo, 0x94a3b8, 'Engine Block & Sump', [xOff, 0.35, sign * 0.42], [sign * 0.785, 0, 0], { metalness: 0.92, roughness: 0.18 });
            }
          }

          addPart(gBlock, new THREE.BoxGeometry(blockLen * 0.94, 0.52, blockW * 0.82), 0x1e293b, 'Engine Block & Sump', [0, -blockH * 0.65, 0], null, { brushed: true });
          const boltCount = Math.min(24, Math.max(8, Math.round(params.boltCount)));
          for (let b = 0; b < boltCount; b++) {
            const side = b % 2 === 0 ? 1 : -1;
            const bx = (((Math.floor(b / 2)) / Math.max(1, boltCount / 2 - 1)) - 0.5) * blockLen * 0.88;
            addPart(gBlock, new THREE.CylinderGeometry(0.035, 0.035, 0.09, 6), 0xfbbf24, 'Engine Block & Sump', [bx, -blockH * 0.48, side * blockW * 0.43]);
          }

          const gCrank = createSubGroup('Crankshaft & Pistons', [0, -1.35, 0]);
          const crankGroup = new THREE.Group();
          crankGroup.position.set(0, -0.25, 0);
          const shaftMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.16, blockLen * 1.12, 20),
            buildMaterial(0xcbd5e1, 'Crankshaft & Pistons', { internal: true, metalness: 0.94, roughness: 0.15 })
          );
          shaftMesh.rotation.z = Math.PI / 2;
          shaftMesh.userData.subsystem = 'Crankshaft & Pistons';
          crankGroup.add(shaftMesh);

          for (let wIdx = 0; wIdx < 6; wIdx++) {
            const wx = ((wIdx / 5) - 0.5) * blockLen * 0.85;
            const cw = new THREE.Mesh(
              new THREE.BoxGeometry(0.12, 0.68, 0.42),
              buildMaterial(0x64748b, 'Crankshaft & Pistons', { internal: true })
            );
            cw.position.set(wx, 0, 0);
            cw.rotation.x = (wIdx * Math.PI) / 3;
            cw.userData.subsystem = 'Crankshaft & Pistons';
            crankGroup.add(cw);
          }
          gCrank.add(crankGroup);
          animatedPartsRef.current.crank = crankGroup;

          for (let bankIdx = 0; bankIdx < 2; bankIdx++) {
            const sign = bankIdx === 0 ? 1 : -1;
            for (let c = 0; c < 4; c++) {
              const xOff = ((c - 1.5) / 3) * (blockLen * 0.72) + (bankIdx === 1 ? 0.14 : -0.14);
              const pGeo = new THREE.CylinderGeometry(0.28 * boreScale, 0.28 * boreScale, 0.34, 24);
              const pMesh = addPart(
                gCrank,
                pGeo,
                0xe2e8f0,
                'Crankshaft & Pistons',
                [xOff, 0.42, sign * 0.48],
                [sign * 0.785, 0, 0],
                { internal: true, metalness: 0.95, roughness: 0.16 }
              );
              pMesh.userData.baseY = 0.42;
              pMesh.userData.baseZ = sign * 0.48;
              animatedPartsRef.current.pistons.push(pMesh);
            }
          }

          const gHeads = createSubGroup('CNC Cylinder Heads', [0, 1.15, 0]);
          [-1, 1].forEach((sign) => {
            addPart(
              gHeads,
              new THREE.BoxGeometry(blockLen * 0.96, 0.62, 0.98 * wallScale),
              0x94a3b8,
              'CNC Cylinder Heads',
              [0, 0.88, sign * 0.78],
              [sign * 0.785, 0, 0],
              { brushed: true, metalness: 0.9, roughness: 0.2 }
            );
            for (let hb = 0; hb < 5; hb++) {
              const hx = ((hb / 4) - 0.5) * blockLen * 0.84;
              addPart(
                gHeads,
                new THREE.CylinderGeometry(0.045, 0.045, 0.14, 12),
                0xf59e0b,
                'CNC Cylinder Heads',
                [hx, 1.15, sign * 1.02],
                [sign * 0.785, 0, 0]
              );
            }
          });

          const gValve = createSubGroup('Valvetrain', [0, 2.05, 0]);
          [-1, 1].forEach((sign) => {
            for (let v = 0; v < 8; v++) {
              const vx = ((v / 7) - 0.5) * blockLen * 0.82;
              const spring = addPart(
                gValve,
                new THREE.CylinderGeometry(0.065, 0.065, 0.26, 12),
                0xfbbf24,
                'Valvetrain',
                [vx, 1.24, sign * 0.92],
                [sign * 0.785, 0, 0],
                { internal: true }
              );
              spring.userData.baseY = 1.24;
              animatedPartsRef.current.valves.push(spring);
            }
            if (isV20) {
              for (let pod = 0; pod < 4; pod++) {
                const px = ((pod - 1.5) / 3) * blockLen * 0.74;
                addPart(
                  gValve,
                  new THREE.CylinderGeometry(0.16, 0.18, 0.34, 16),
                  0x38bdf8,
                  'Valvetrain',
                  [px, 1.48, sign * 1.14],
                  [sign * 0.785, 0, 0],
                  { metalness: 0.88, roughness: 0.22 }
                );
              }
            } else {
              addPart(
                gValve,
                new THREE.BoxGeometry(blockLen * 0.92, 0.32, 0.78),
                0xd97706,
                'Valvetrain',
                [0, 1.38, sign * 1.06],
                [sign * 0.785, 0, 0],
                { brushed: true }
              );
            }
          });

          const gIntake = createSubGroup('Intake & Fuel Rail', [0, 2.55, 0]);
          addPart(gIntake, new THREE.BoxGeometry(blockLen * 0.84, 0.44, 0.96), 0x1e293b, 'Intake & Fuel Rail', [0, 1.22, 0], null, { carbon: true });
          [-0.55, 0.55].forEach((tx) => {
            const tb = new THREE.CylinderGeometry(0.24, 0.24, 0.38, 24);
            tb.rotateZ(Math.PI / 2);
            addPart(gIntake, tb, 0x38bdf8, 'Intake & Fuel Rail', [tx, 1.52, 0], [0, Math.PI / 2, 0]);
          });
          [-0.46, 0.46].forEach((fz) => {
            const rail = new THREE.CylinderGeometry(0.045, 0.045, blockLen * 0.82, 16);
            rail.rotateZ(Math.PI / 2);
            addPart(gIntake, rail, 0xf59e0b, 'Intake & Fuel Rail', [0, 1.36, fz]);
          });

          const gHeaders = createSubGroup('Tuned Exhaust Headers', [0, 0.2, 0]);
          [-1, 1].forEach((sign) => {
            for (let p = 0; p < 4; p++) {
              const px = ((p - 1.5) / 3) * blockLen * 0.72;
              const pipe = new THREE.CylinderGeometry(0.11, 0.11, 1.15, 16);
              addPart(
                gHeaders,
                pipe,
                0xd97706,
                'Tuned Exhaust Headers',
                [px - 0.18, 0.42, sign * 1.22],
                [sign * 0.45, 0, 0.35],
                { emissive: 0x9a3412, emissiveIntensity: 0.42, metalness: 0.88, roughness: 0.24 }
              );
            }
            const collector = new THREE.CylinderGeometry(0.22, 0.18, 0.95, 20);
            collector.rotateZ(Math.PI / 2);
            addPart(
              gHeaders,
              collector,
              0xb45309,
              'Tuned Exhaust Headers',
              [-blockLen * 0.44, -0.08, sign * 1.38],
              null,
              { emissive: 0x7c2d12, emissiveIntensity: 0.35 }
            );
          });

          if (isV20) {
            const gCool = createSubGroup('Coolant Crossover', [1.45, 0.9, 0]);
            const crossTube = new THREE.CylinderGeometry(0.09, 0.09, 1.85, 16);
            crossTube.rotateX(Math.PI / 2);
            addPart(gCool, crossTube, 0x38bdf8, 'Coolant Crossover', [blockLen * 0.46, 1.28, 0]);
            [-0.85, 0.85].forEach((cz) => {
              addPart(gCool, new THREE.CylinderGeometry(0.14, 0.14, 0.18, 6), 0xf59e0b, 'Coolant Crossover', [blockLen * 0.46, 1.28, cz]);
            });

            const gBell = createSubGroup('Bellhousing & Flywheel', [-1.85, 0, 0]);
            const ring = new THREE.TorusGeometry(1.12, 0.14, 16, 36);
            ring.rotateY(Math.PI / 2);
            addPart(gBell, ring, 0x64748b, 'Bellhousing & Flywheel', [-blockLen * 0.56, -0.1, 0], null, { brushed: true });
            const flywheel = new THREE.CylinderGeometry(0.92, 0.92, 0.12, 36);
            flywheel.rotateZ(Math.PI / 2);
            addPart(gBell, flywheel, 0xfbbf24, 'Bellhousing & Flywheel', [-blockLen * 0.52, -0.1, 0]);
          }
        } else {
          const chamberR = 0.82 * boreScale;
          const chamberLen = 2.6 * strokeScale;

          const gChamber = createSubGroup('Regen Thrust Chamber', [-1.5, 0, 0]);
          const throat = new THREE.CylinderGeometry(chamberR * 0.72, chamberR * 0.46, chamberLen * 0.48, 36);
          throat.rotateZ(Math.PI / 2);
          addPart(gChamber, throat, 0xd97706, 'Regen Thrust Chamber', [-0.4, 0, 0], null, { brushed: true, metalness: 0.92, roughness: 0.2 });

          const nozzle = new THREE.CylinderGeometry(chamberR * 0.46, chamberR * 1.32, chamberLen * 0.68, 40, 1, true);
          nozzle.rotateZ(Math.PI / 2);
          addPart(
            gChamber,
            nozzle,
            alloy.color,
            'Regen Thrust Chamber',
            [-0.4 - chamberLen * 0.56, 0, 0],
            null,
            { emissive: 0x9a3412, emissiveIntensity: 0.38 }
          );

          for (let r = 0; r < 5; r++) {
            const rx = -0.75 - r * 0.32;
            const band = new THREE.TorusGeometry(chamberR * (0.52 + r * 0.17), 0.032, 10, 36);
            band.rotateY(Math.PI / 2);
            addPart(gChamber, band, 0x38bdf8, 'Regen Thrust Chamber', [rx, 0, 0]);

          addPart(gGimbal, gimbalRing, 0x38bdf8, '2-Axis Gimbal Ring', [0.15, 0, 0]);

          [-1, 1].forEach((sign) => {
            const actuator = new THREE.CylinderGeometry(0.08, 0.08, 1.35, 16);

          const gTurbo = createSubGroup('Dual Turbopumps', [0, -1.25, 0]);

        if (uploadedMeshAsset && uploadedMeshAsset.geometry) {

          const customMesh = new THREE.Mesh(

          );
          customMesh.position.set(0, 1.85, 0);
          customMesh.userData.subsystem = 'Uploaded Custom Mesh';
          root.add(customMesh);
        }

        scene.add(root);
        assemblyRootRef.current = root;

        if (onExportStlReady) {
          onExportStlReady(() => exportGroupToAsciiStl(root, `${domain}_v20_assembly`));
        }

        return () => {
          brushedTex.dispose();
          carbonTex.dispose();
        };
      }, [
        domain,
        renderMode,
        params,
        sliceAxis,
        slicePercent,
        visibilityMap,
        isolatedSubsystem,
        selectedSubsystem,
        uploadedMeshAsset,
        onExportStlReady
      ]);

      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        if (photoMeshRef.current) {
          scene.remove(photoMeshRef.current);
          disposeObject3D(photoMeshRef.current);
          photoMeshRef.current = null;
        }

        if (!calibratedPhoto.visible || !calibratedPhoto.url) return;

        let cancelled = false;
        const loader = new THREE.TextureLoader();
        loader.load(calibratedPhoto.url, (texture) => {
          if (cancelled || !sceneRef.current) {
            texture.dispose();
            return;
          }
          const aspect = calibratedPhoto.naturalWidth && calibratedPhoto.naturalHeight
            ? calibratedPhoto.naturalWidth / calibratedPhoto.naturalHeight
            : 1.5;
          const planeH = 4.6;
          const planeW = planeH * aspect;
          const geo = new THREE.PlaneGeometry(planeW, planeH);
          const mat = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            opacity: calibratedPhoto.opacity,
            side: THREE.DoubleSide
          });
          const planeMesh = new THREE.Mesh(geo, mat);
          planeMesh.position.set(0, 0.3, -2.6);
          sceneRef.current.add(planeMesh);
          photoMeshRef.current = planeMesh;

        return () => {
          cancelled = true;

            <text x="14" y="106" fontSize="8.5" fill="#38BDF8" fontWeight="bold">
              DISPLACEMENT / ENVELOPE: {telemetry.dispStr} · YIELD σy: {telemetry.yieldMPa} MPa · MAX TEMP: {telemetry.maxTempC}°C
            </text>
            <text x="14" y="124" fontSize="8" fill="#10B981">
              VERIFICATION STATUS: {telemetry.dmlsStatus} · MANIFOLD B-REP WATERTIGHT · READY FOR .SVG / .STL / .JSON MBD EXPORT
            </text>
          </g>
        </svg>
      );
    }

    // =========================================================================
    // 5b. DRAFTING STUDIO SHEET (v2) — professional 2D drafting driven by the
    // active part's real parameters. Geometry views use the live bench params
    // (one source of truth with the 3D bench); parameters-only parts get a
    // parameters table instead of geometry — never a fake mesh, never a
    // placeholder dimension. Default tolerance ±0.005 in unless the source
    // says otherwise. No dimension invented: every number carries its source
    // or an UNVERIFIED flag.
    // =========================================================================
    function DraftingStudioSheet({ activePart, params, deckHeightIn, units, titleMeta, svgRef }) {
      const alloy = ALLOYS.find((a) => a.id === params.materialId) || ALLOYS[0];
      const fmtNum = (inches) =>
        units === 'MM' ? `${(inches * 25.4).toFixed(2)}` : `${Number(inches).toFixed(3)}`;
      const fmtDim = (inches) =>
        typeof inches === 'number' && !Number.isNaN(inches) && inches > 0
          ? `${fmtNum(inches)} ${units === 'MM' ? 'mm' : 'in'}`
          : '[UNSPECIFIED — NO DIMENSION INVENTED]';
      const tolDefault = units === 'MM' ? '±0.13 mm' : '±0.005 in';
      const part = activePart || {
        name: 'SBC 350 Showroom Reference (proven numbers)',
        code: 'SBC-SHOWROOM-350',
        source: 'Proven published SBC numbers — GM Service Manual',
        verification: 'PROVEN — PUBLISHED SBC NUMBERS',
        hasMesh: true,
        data: null
      };
      const data = part.data || {};
      const boreSpacing = typeof data.boreSpacing === 'number' ? data.boreSpacing : 4.4;
      const boreSpacingSource =
        typeof data.boreSpacing === 'number'
          ? part.source || 'UNVERIFIED'
          : 'SBC bore spacing 4.400 in (Chevrolet Power Manual)';
      const cylinders = typeof data.cylinders === 'number' ? data.cylinders : 8;
      const perRow = cylinders === 6 ? 6 : 4;
      const rows = cylinders === 6 ? 1 : 2;
      const bore = params.boreIn;
      const rowSpanIn = (perRow - 1) * boreSpacing + bore;
      const planScale = 272 / Math.max(1, rowSpanIn);
      const planW = rowSpanIn * planScale;
      const planX0 = (320 - planW) / 2;
      const boreR = (bore / 2) * planScale;
      const rowGap = bore * planScale * 0.62 + 12;
      const cy1 = rows === 1 ? 92 : 92 - rowGap / 2;
      const cy2 = 92 + rowGap / 2;
      const deckScaleV = 110 / Math.max(1, deckHeightIn);
      const elevH = deckHeightIn * deckScaleV;
      const detailR = bore * planScale;

      const paramRows = [];
      if (!part.hasMesh && part.data) {
        if (part.kind === 'transmission') {
          const t = part.data;
          paramRows.push(['Type', `${t.type} · ${t.category}`, t.desc || 'UNVERIFIED']);
          paramRows.push(['Gear ratios', t.ratios.map((r, i) => `G${i + 1} ${r}`).join(' · '), t.desc || 'UNVERIFIED']);
          paramRows.push(['Reverse', `${t.reverse}`, t.desc || 'UNVERIFIED']);
          paramRows.push(['Overall length', fmtDim(t.lengthInches), t.desc || 'UNVERIFIED']);
          if (t.defaultStall) paramRows.push(['Stall', `${t.defaultStall} rpm`, t.desc || 'UNVERIFIED']);
          paramRows.push(['Clutch / converter', t.clutch || 'UNVERIFIED', t.desc || 'UNVERIFIED']);
          paramRows.push(['Tunnel profile', t.tunnelProfile || 'UNVERIFIED', 'NEEDING RAY\'S MEASUREMENT']);
          paramRows.push(['Bellhousing pattern', t.nativePattern || 'UNVERIFIED', t.desc || 'UNVERIFIED']);
        } else if (part.kind === 'model') {
          const m = part.data;
          paramRows.push(['Make / model', `${m.make} ${m.model}`, (m.sources || []).join(' · ') || 'UNVERIFIED']);
          paramRows.push(['Years', `${m.yearStart}–${m.yearEnd || 'present'}`, (m.sources || []).join(' · ') || 'UNVERIFIED']);
          paramRows.push(['Category', m.category, (m.sources || []).join(' · ') || 'UNVERIFIED']);
          paramRows.push(['Chassis codes', (m.chassisCodes || []).join(', ') || 'UNVERIFIED', (m.sources || []).join(' · ') || 'UNVERIFIED']);
          paramRows.push(['Verification', m.verificationStatus || 'PARTIAL', 'Batch M Packets 1-2 of 6']);
          (m.yearRanges || []).forEach((r) => {
            const engNames = (r.engineIds || []).map((id) => {
              const e = resolveLibraryLinkRef(id, 'engine');
              return e ? e.shortName || e.name : `${id} — not in the library yet`;
            });
            const trNames = (r.transmissionIds || []).map((id) => {
              const t = resolveLibraryLinkRef(id, 'transmission');
              return t ? t.name : `${id} — not in the library yet`;
            });
            paramRows.push([
              `${r.yearStart}–${r.yearEnd} · ${r.trimNote}`,
              `Engines: ${engNames.join(' · ') || 'none'} | Transmissions: ${trNames.join(' · ') || 'none'}`,
              (m.sources || []).join(' · ') || 'UNVERIFIED'
            ]);
          });
        } else if (part.kind === 'part') {
          const p = part.data;
          paramRows.push(['System', `${p.name} (${p.shortName})`, 'SBC app part systems']);
          paramRows.push(['Group', p.group, 'SBC app part systems']);
          paramRows.push(['Description', p.description, 'SBC app part systems']);
          paramRows.push(['Fields', p.fields.map((f) => f.label).join(' · '), 'SBC app part systems']);
          paramRows.push(['Subassemblies', (p.subassemblyKeys || []).join(', '), 'SBC app part systems']);
          paramRows.push(['BOM categories', (p.bomCategories || []).join(', '), 'SBC app part systems']);
        }
      }

      return (
        <svg
          ref={svgRef}
          viewBox="0 0 1120 760"
          className="w-full h-auto rounded-lg border border-slate-700 bg-[#050810] text-sky-300 font-mono-tabular select-none"
        >
          <defs>
            <pattern id="draftHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="8" stroke="#F59E0B" strokeWidth="1.2" strokeOpacity="0.65" />
            </pattern>
            <marker id="draftArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38BDF8" />
            </marker>
            <marker id="draftSeqArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M 0 2 L 8 5 L 0 8 z" fill="#FBBF24" />
            </marker>
          </defs>

          <rect x="10" y="10" width="1100" height="740" fill="none" stroke="#475569" strokeWidth="2.0" />
          <rect x="18" y="18" width="1084" height="724" fill="none" stroke="#334155" strokeWidth="1.0" />

          <g transform="translate(28, 28)">
            <rect x="0" y="0" width="520" height="30" rx="4" fill="#090E1A" stroke="#1E293B" strokeWidth="1" />
            <text x="10" y="12" fontSize="8" fill="#38BDF8" fontWeight="bold">
              DRAFTING STUDIO — LINE WEIGHTS (ASME Y14.5M-2018 / ISO 2768-m):
            </text>
            <text x="10" y="24" fontSize="7.5" fill="#CBD5E1">
              Visible/Cut: 0.70mm (2.0px) · Hidden: 0.35mm (1.1px) · Centerline: 0.18mm (0.75px) · Dim/Leader: 0.25mm (0.9px) · 2:1 Detail: 0.50mm
            </text>
          </g>

          <g transform="translate(560, 28)">
            <rect x="0" y="0" width="530" height="30" rx="4" fill="#090E1A" stroke="#10B981" strokeOpacity="0.45" strokeWidth="1" />
            <text x="10" y="18" fontSize="8" fill="#34D399" fontWeight="bold">
              ZERO-INVENTED-DIMENSIONS RULE: ONLY ACTIVE SPECS, STANDARDS &amp; USER INPUTS SHOWN
            </text>
          </g>

          {part.hasMesh ? (
            <g>
              {/* VIEW 1 (TOP-LEFT): PLAN VIEW */}
              <g transform="translate(28, 72)">
                <text x="0" y="10" fontSize="9.5" fill="#94A3B8" fontWeight="bold">
                  1. PLAN VIEW — DECK FACE (DATUM -A- | -B- | -C-)
                </text>
                <rect x="0" y="18" width="320" height="175" rx="6" fill="none" stroke="#38BDF8" strokeWidth="2.0" />
                <rect
                  x={planX0 - 14}
                  y={cy1 - boreR - 12}
                  width={planW + 28}
                  height={rows === 1 ? boreR * 2 + 24 : rowGap + boreR * 2 + 24}
                  fill="none"
                  stroke="#38BDF8"
                  strokeWidth="1.8"
                />
                {Array.from({ length: perRow }).map((_, i) => {
                  const cx = planX0 + boreR + i * boreSpacing * planScale;
                  return (
                    <g key={`r1-${i}`}>
                      <circle cx={cx} cy={cy1} r={boreR} fill="none" stroke="#34D399" strokeWidth="1.3" />
                      {rows === 2 && (
                        <circle cx={cx} cy={cy2} r={boreR} fill="none" stroke="#34D399" strokeWidth="1.3" />
                      )}
                    </g>
                  );
                })}
                <line x1="8" y1="92" x2="312" y2="92" stroke="#64748B" strokeDasharray="10,3,2,3" strokeWidth="0.75" />
                <line x1="160" y1="24" x2="160" y2="186" stroke="#64748B" strokeDasharray="10,3,2,3" strokeWidth="0.75" />
                <text x="14" y="210" fontSize="8.5" fill="#38BDF8" fontWeight="bold">
                  BORE Ø {fmtNum(bore)} {units === 'MM' ? 'mm' : 'in'} {tolDefault} · DATUM [A|B|C] · SPACING {fmtNum(boreSpacing)} {units === 'MM' ? 'mm' : 'in'}
                </text>
                <text x="14" y="224" fontSize="8" fill="#CBD5E1">
                  {cylinders} cylinders · {rows === 1 ? 'inline' : 'V-bank'} · Spacing source: {boreSpacingSource}
                </text>
              </g>

              {/* VIEW 2 (TOP-CENTER): FRONT ELEVATION */}
              <g transform="translate(385, 72)">
                <text x="0" y="10" fontSize="9.5" fill="#94A3B8" fontWeight="bold">
                  2. FRONT ELEVATION — DECK HEIGHT
                </text>
                <rect x="0" y="18" width="320" height="175" rx="6" fill="none" stroke="#38BDF8" strokeWidth="2.0" />
                <rect
                  x={(320 - planW) / 2}
                  y={105 - elevH / 2}
                  width={planW}
                  height={elevH}
                  fill="url(#draftHatch)"
                  stroke="#38BDF8"
                  strokeWidth="1.8"
                />
                <line x1="160" y1="24" x2="160" y2="186" stroke="#64748B" strokeDasharray="10,3,2,3" strokeWidth="0.75" />
                <line
                  x1={160 + planW / 2 + 14}
                  y1={105 - elevH / 2}
                  x2={160 + planW / 2 + 14}
                  y2={105 + elevH / 2}
                  stroke="#38BDF8"
                  strokeWidth="0.9"
                  markerStart="url(#draftArrow)"
                  markerEnd="url(#draftArrow)"
                />
                <text x="14" y="210" fontSize="8.5" fill="#38BDF8" fontWeight="bold">
                  DECK HEIGHT: {fmtDim(deckHeightIn)} {tolDefault} · DATUM [-A-]
                </text>
                <text x="14" y="224" fontSize="8" fill="#CBD5E1">
                  STROKE / LENGTH: {fmtDim(params.strokeIn)} · WALL: {fmtDim(params.wallIn)} · FILLET: {fmtDim(params.filletIn)}
                </text>
              </g>

              {/* VIEW 3 (TOP-RIGHT): RIGHT SECTION */}
              <g transform="translate(740, 72)">
                <text x="0" y="10" fontSize="9.5" fill="#94A3B8" fontWeight="bold">
                  3. RIGHT SECTION — WALL &amp; CUT
                </text>
                <rect x="0" y="18" width="350" height="175" rx="6" fill="none" stroke="#38BDF8" strokeWidth="2.0" />
                <polygon
                  points="175,40 275,88 275,140 175,178 75,140 75,88"
                  fill="url(#draftHatch)"
                  stroke="#38BDF8"
                  strokeWidth="1.8"
                />
                <line x1="75" y1="88" x2="175" y2="118" stroke="#38BDF8" strokeWidth="1.0" />
                <line x1="275" y1="88" x2="175" y2="118" stroke="#38BDF8" strokeWidth="1.0" />
                <line x1="175" y1="118" x2="175" y2="178" stroke="#38BDF8" strokeWidth="1.0" />
                <line x1="175" y1="24" x2="175" y2="186" stroke="#64748B" strokeDasharray="10,3,2,3" strokeWidth="0.75" />
                <text x="12" y="210" fontSize="8.5" fill="#38BDF8" fontWeight="bold">
                  WALL: {fmtDim(params.wallIn)} {tolDefault} · FILLET R {fmtDim(params.filletIn)} · BOLTS: {params.boltCount}
                </text>
                <text x="12" y="224" fontSize="8" fill="#CBD5E1">
                  END DATUM [-B-] · SECTION CUT THROUGH BORE CENTERLINE
                </text>
              </g>

              {/* VIEW 4 (MIDDLE-LEFT): 2:1 DETAIL OF BORE DATUM */}
              <g transform="translate(28, 325)">
                <text x="0" y="10" fontSize="9.5" fill="#34D399" fontWeight="bold">
                  4. DETAIL C (SCALE 2:1) — BORE DATUM [-A-]
                </text>
                <rect x="0" y="18" width="320" height="225" rx="6" fill="#090E1A" stroke="#34D399" strokeWidth="1.4" />
                <circle cx="160" cy="118" r={detailR} fill="#050810" stroke="#38BDF8" strokeWidth="2.0" />
                <circle cx="160" cy="118" r={detailR * 0.78} fill="none" stroke="#34D399" strokeWidth="1.5" />
                <circle cx="160" cy="118" r={detailR * 0.6} fill="none" stroke="#F59E0B" strokeDasharray="4,3" strokeWidth="1.1" />
                <line x1="40" y1="118" x2="280" y2="118" stroke="#64748B" strokeDasharray="10,3,2,3" strokeWidth="0.75" />
                <line x1="160" y1="28" x2="160" y2="208" stroke="#64748B" strokeDasharray="10,3,2,3" strokeWidth="0.75" />
                <text x="12" y="222" fontSize="8.5" fill="#38BDF8" fontWeight="bold">
                  NOMINAL: Ø{fmtNum(bore)} {units === 'MM' ? 'mm' : 'in'} · {tolDefault}
                </text>
                <text x="12" y="236" fontSize="8" fill="#10B981">
                  DATUM [-A-] · {alloy.finishRa}
                </text>
              </g>
            </g>
          ) : (
            <g transform="translate(28, 72)">
              <text x="0" y="10" fontSize="9.5" fill="#F59E0B" fontWeight="bold">
                PARAMETERS ONLY — NO MESH: THIS ENTRY CARRIES PARAMETERS, NOT GEOMETRY
              </text>
              <rect x="0" y="18" width="1062" height="480" rx="6" fill="#090E1A" stroke="#F59E0B" strokeWidth="1.4" />
              <text x="14" y="44" fontSize="8.5" fill="#FBBF24" fontWeight="bold">
                The 3D bench still shows the last loaded mesh. This sheet lists the entry's real parameters and invents nothing.
              </text>
              {paramRows.map((row, i) => (
                <g key={i} transform={`translate(14, ${66 + i * 34})`}>
                  <text x="0" y="0" fontSize="9" fill="#94A3B8" fontWeight="bold">
                    {row[0].toUpperCase()}
                  </text>
                  <text x="0" y="14" fontSize="8.5" fill="#F1F5F9">
                    {String(row[1]).slice(0, 150)}
                  </text>
                  <text x="0" y="26" fontSize="7.5" fill="#34D399">
                    Source: {String(row[2]).slice(0, 130)}
                  </text>
                </g>
              ))}
              {paramRows.length === 0 && (
                <text x="14" y="80" fontSize="9" fill="#F59E0B">
                  No parameters recorded for this entry yet — nothing invented.
                </text>
              )}
            </g>
          )}

          {/* 17-POSITION HEAD BOLT SEQUENCE (#1 -> #17 WITH DIRECTIONAL ARROWS) */}
          <g transform="translate(365, 325)">
            <text x="0" y="10" fontSize="9.5" fill="#FBBF24" fontWeight="bold">
              SBC-350 17-BOLT HEAD SEQUENCE (#1 → #17 LINEAR/STAGGERED — NOT A CIRCLE)
            </text>
            <rect x="0" y="18" width="340" height="225" rx="6" fill="#090E1A" stroke="#F59E0B" strokeWidth="1.3" />
            <rect x="24" y="34" width="292" height="106" rx="4" fill="#050810" stroke="#334155" strokeWidth="1.2" />
            {SBC350_17_BOLT_SEQUENCE.slice(0, -1).map((pt, idx) => {
              const nxt = SBC350_17_BOLT_SEQUENCE[idx + 1];
              return (
                <line
                  key={`seq-${pt.seq}`}
                  x1={pt.x}
                  y1={pt.y}
                  x2={nxt.x}
                  y2={nxt.y}
                  stroke="#F59E0B"
                  strokeOpacity="0.65"
                  strokeWidth="1.1"
                  strokeDasharray="3,2"
                  markerEnd="url(#draftSeqArrow)"
                />
              );
            })}
            {SBC350_17_BOLT_SEQUENCE.map((pt) => (
              <g key={pt.seq}>
                <circle
                  cx={pt.x}
                  cy={pt.y}
                  r="9.5"
                  fill={pt.seq === 1 ? '#F59E0B' : '#0E1420'}
                  stroke="#FBBF24"
                  strokeWidth="1.4"
                />
                <text
                  x={pt.x}
                  y={pt.y + 3}
                  textAnchor="middle"
                  fontSize="7.5"
                  fontWeight="bold"
                  fill={pt.seq === 1 ? '#050810' : '#FBBF24'}
                >
                  {pt.seq}
                </text>
              </g>
            ))}
            <text x="12" y="156" fontSize="8.5" fill="#FBBF24" fontWeight="bold">
              TORQUE SCHEDULE (PASS-BY-PASS SEQUENCE #1 → #17):
            </text>
            <text x="12" y="170" fontSize="8" fill="#E2E8F0">
              • Pass 1 Seating: 25 lb-ft (33.9 N·m) · Pass 2 Mid-Load: 45 lb-ft (61.0 N·m)
            </text>
            <text x="12" y="183" fontSize="8" fill="#10B981" fontWeight="bold">
              • Pass 3 Final Spec: 65 lb-ft (88.1 N·m) [Standard] or 70 lb-ft (94.9 N·m) [ARP Stud Spec]
            </text>
            <text x="12" y="197" fontSize="8" fill="#94A3B8">
              • Thread / Lubricant Note: {alloy.threadSpec} · Lubricate threads &amp; under-head washers
            </text>
            <text x="12" y="211" fontSize="8" fill="#CBD5E1">
              • Heat-Treat: {alloy.heatTreat}
            </text>
            <text x="12" y="224" fontSize="8" fill="#CBD5E1">
              • Surface Finish: {alloy.finishRa}
            </text>
          </g>

          {/* MATERIAL, HEAT-TREAT, THREAD & REVISION TITLE BLOCK */}
          <g transform="translate(722, 325)">
            <text x="0" y="10" fontSize="9.5" fill="#38BDF8" fontWeight="bold">
              ENGINEERING SPECIFICATION &amp; TITLE BLOCK
            </text>
            <rect x="0" y="18" width="368" height="225" rx="6" fill="#090E1A" stroke="#475569" strokeWidth="1.5" />
            <text x="12" y="38" fontSize="8" fill="#94A3B8">PART</text>
            <text x="12" y="53" fontSize="9.5" fill="#F1F5F9" fontWeight="bold">
              {part.name.slice(0, 44)}
            </text>
            <line x1="0" y1="64" x2="368" y2="64" stroke="#334155" strokeWidth="1" />
            <text x="12" y="80" fontSize="8" fill="#94A3B8">MATERIAL (PBR SPECIFIED)</text>
            <text x="12" y="94" fontSize="8.5" fill="#38BDF8" fontWeight="bold">{alloy.name}</text>
            <line x1="0" y1="104" x2="368" y2="104" stroke="#334155" strokeWidth="1" />
            <text x="12" y="120" fontSize="8" fill="#94A3B8">HEAT-TREAT &amp; SURFACE FINISH</text>
            <text x="12" y="133" fontSize="8" fill="#CBD5E1">{alloy.heatTreat}</text>
            <text x="12" y="146" fontSize="8" fill="#10B981">{alloy.finishRa}</text>
            <line x1="0" y1="156" x2="368" y2="156" stroke="#334155" strokeWidth="1" />
            <text x="12" y="172" fontSize="8" fill="#94A3B8">SOURCE &amp; VERIFICATION</text>
            <text x="12" y="185" fontSize="8" fill="#E2E8F0">{String(part.source || 'UNVERIFIED').slice(0, 52)}</text>
            <text x="12" y="198" fontSize="8" fill="#FBBF24">{part.verification}</text>
            <line x1="0" y1="208" x2="368" y2="208" stroke="#334155" strokeWidth="1" />
            <text x="12" y="224" fontSize="8.5" fill="#38BDF8" fontWeight="bold">
              DWG: {titleMeta.drawingNumber} · REV {titleMeta.revision} · SCALE NTS · SHEET 1 OF 1
            </text>
            <text x="12" y="237" fontSize="8" fill="#94A3B8">
              {titleMeta.engineer} · 3RD ANGLE PROJECTION · SCHEMATIC — NOT TO SCALE
            </text>
          </g>

          {/* BOTTOM NOTES STRIP */}
          <g transform="translate(28, 586)">
            <rect x="0" y="0" width="1062" height="142" rx="6" fill="#090E1A" stroke="#334155" strokeWidth="1.2" />
            <text x="14" y="18" fontSize="8.5" fill="#F59E0B" fontWeight="bold">
              GENERAL ENGINEERING &amp; MANUFACTURING NOTES (ASME Y14.5M-2018 / ISO 2768-m):
            </text>
            <text x="14" y="34" fontSize="8" fill="#CBD5E1">
              1. ALL DIMENSIONS &amp; TOLERANCES CONFORM TO ASME Y14.5M-2018 AND ISO 2768-m. DEFAULT TOLERANCE {tolDefault} UNLESS THE SOURCE SAYS OTHERWISE.
            </text>
            <text x="14" y="50" fontSize="8" fill="#CBD5E1">
              2. HEAD BOLT TORQUE SEQUENCE FOLLOWS #1 THROUGH #17 IN ORDER (NOT A CIRCLE) WITH PROGRESSIVE PASSES (25 -&gt; 45 -&gt; 65 OR 70 LB-FT).
            </text>
            <text x="14" y="66" fontSize="8" fill="#CBD5E1">
              3. DETAIL C (SCALE 2:1) ENLARGES DATUM [-A-] BORE FOR INSPECTION OF ROUNDNESS, CYLINDRICITY &amp; SURFACE FINISH PRIOR TO FINAL ASSEMBLY.
            </text>
            <text x="14" y="82" fontSize="8" fill="#CBD5E1">
              4. EDITING A DIMENSION IN THE DRAFTING STUDIO UPDATES THE 3D BENCH; EDITING THE BENCH UPDATES THIS SHEET — ONE SOURCE OF TRUTH.
            </text>
            <text x="14" y="106" fontSize="8.5" fill="#38BDF8" fontWeight="bold">
              ACTIVE PART: {part.name.slice(0, 60)} · {part.verification}
            </text>
            <text x="14" y="124" fontSize="8" fill="#10B981">
              BORE Ø {fmtNum(bore)} {units === 'MM' ? 'mm' : 'in'} · STROKE {fmtNum(params.strokeIn)} {units === 'MM' ? 'mm' : 'in'} · DECK {fmtNum(deckHeightIn)} {units === 'MM' ? 'mm' : 'in'} · YIELD σy: {alloy.yieldMPa} MPa
            </text>
          </g>
        </svg>
      );
    }

    // v2 helper for the drafting sheet's parameters-only table: resolve a link the
    // same way the matrix does (aliases included). Defined at module scope so the
    // sheet component can use it without a prop thread.
    function resolveLibraryLinkRef(linkId, kind) {
      if (!linkId) return null;
      const list = kind === 'engine' ? LIBRARY_ENGINES : LIBRARY_TRANSMISSIONS;
      const direct = list.find((e) => e.id === linkId);
      if (direct) return direct;
      const aliased = LIBRARY_ID_ALIASES[linkId];
      if (aliased) return list.find((e) => e.id === aliased) || null;
      const stripped = linkId.replace(/^gm_/, '');
      return list.find((e) => e.id === stripped) || null;
    }

      const telemetry = useMemo(() => {

        if (r > 0) geo.scale(1.8 / r, 1.8 / r, 1.8 / r);
        setUploadedMeshAsset((prev) => {

          return { name: fileName, geometry: geo };

        notify(`Loaded 3D mesh: ${fileName}`);

      const handleUniversalFiles = (fileList) => {

          if (/\.(png|jpg|jpeg|webp)$/.test(lower)) {

          } else if (lower.endsWith('.json')) {

              try {
                const parsed = JSON.parse(String(ev.target.result || '{}'));
                if (parsed.params) setParams((p) => ({ ...p, ...parsed.params }));
                if (parsed.domain) setDomain(parsed.domain);
                if (Array.isArray(parsed.accessories)) {

      const applyLibraryEntryToBench = (item, forceDomain) => {

        setParams((prev) => ({

      // v2: find a library entry by kind + id (used for localStorage rehydrate + BOM kinds).
      const findLibraryEntry = (kind, id) => {
        if (kind === 'showroom') return SHOWROOM_SBC350;
        if (kind === 'engine') return LIBRARY_ENGINES.find((e) => e.id === id) || null;
        if (kind === 'storeEngine') return LIBRARY_STORE_ENGINES.find((e) => e.id === id) || null;
        if (kind === 'transmission') return LIBRARY_TRANSMISSIONS.find((t) => t.id === id) || null;
        if (kind === 'model') return LIBRARY_MODELS.find((m) => m.id === id) || null;
        if (kind === 'part') return LIBRARY_PART_SYSTEMS.find((p) => p.id === id) || null;
        if (kind === 'concept')
          return [...VEHICLE_MATRIX_LIBRARY, ...ACCESSORIES_CATALOG].find((c) => c.id === id) || null;
        if (kind === 'preset') return SBC350_V16_PRESETS.find((p) => p.id === id) || null;
        return null;

      // v2: build the single-source-of-truth active part record for a library entry.
      const buildActivePart = (kind, entry) => {
        if (!entry) return null;

            data: null

            code: entry.shortName || entry.code || entry.id,

            source: entry.desc || 'UNVERIFIED',

            hasMesh: false,
            source: (entry.sources || []).join(' · ') || 'UNVERIFIED',

            hasMesh: false,
            source: 'SBC app part systems (partModifications.ts)',

            data: entry

          return {
            kind,
            id: entry.id,
            name: entry.name,
            code: entry.code || entry.sku || entry.id,
            hasMesh: true,
            source: 'Concept catalog — the file\'s own concept numbers, not the standard',
            verification: entry.status || 'CONCEPT',
            data: entry
          };

        if (kind === 'preset') {
          return {
            kind,
            id: entry.id,
            name: entry.name,
            code: entry.code,
            hasMesh: true,
            source: 'SBC-350 v16 preset',
            verification: 'PRESET',
            data: entry
          };
        }
        return null;
      };

      const buildActivePartFromRef = (ref) => {
        if (!ref || !ref.kind || !ref.id) return null;
        if (ref.kind === 'showroom') return buildActivePart('showroom', SHOWROOM_SBC350);
        const entry = findLibraryEntry(ref.kind, ref.id);
        return entry ? buildActivePart(ref.kind, entry) : null;
