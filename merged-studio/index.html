      const grad = ctx.createLinearGradient(0, 0, 0, 256);

    function createSimpleOrbitController(camera, domElement, initialTarget) {
      const target = initialTarget ? initialTarget.clone() : new THREE.Vector3(0, 0.2, 0);
      const offset = camera.position.clone().sub(target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      let isDragging = false;
      let dragMode = 'ROTATE';
      let lastX = 0;
      let lastY = 0;
      let lastPinchDist = null;
      let dampingTheta = 0;
      let dampingPhi = 0;

      const syncFromCamera = () => {
        offset.copy(camera.position).sub(target);
        spherical.setFromVector3(offset);
        spherical.radius = THREE.MathUtils.clamp(spherical.radius, 2.2, 26.0);
        spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.12, Math.PI - 0.12);
      };

      const applySpherical = () => {
        spherical.radius = THREE.MathUtils.clamp(spherical.radius, 2.2, 26.0);
        spherical.phi = THREE.MathUtils.clamp(spherical.phi, 0.12, Math.PI - 0.12);
        offset.setFromSpherical(spherical);
        camera.position.copy(target).add(offset);
        camera.lookAt(target);
      };

      const onMouseDown = (e) => {
        isDragging = true;
        dragMode = (e.button === 2 || e.shiftKey) ? 'PAN' : 'ROTATE';
        lastX = e.clientX;
        lastY = e.clientY;
        dampingTheta = 0;
        dampingPhi = 0;
      };

      const onMouseMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        if (dragMode === 'ROTATE') {
          const rotSpeed = 0.0065;
          dampingTheta = -dx * rotSpeed;
          dampingPhi = -dy * rotSpeed;
          spherical.theta += dampingTheta;
          spherical.phi += dampingPhi;
          applySpherical();
        } else {
          const panScale = spherical.radius * 0.0014;
          const forward = target.clone().sub(camera.position).normalize();
          const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
          const up = new THREE.Vector3().crossVectors(right, forward).normalize();
          target.addScaledVector(right, -dx * panScale);
          target.addScaledVector(up, dy * panScale);
          applySpherical();
        }
      };

      const onMouseUp = () => {
        isDragging = false;
      };

      const onWheel = (e) => {
        e.preventDefault();
        syncFromCamera();
        const scale = e.deltaY > 0 ? 1.1 : 0.9;
        spherical.radius *= scale;
        applySpherical();
      };

      const onTouchStart = (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          dragMode = 'ROTATE';
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          lastPinchDist = null;
        } else if (e.touches.length === 2) {
          isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastPinchDist = Math.hypot(dx, dy);
        }
      };

      const onTouchMove = (e) => {
        if (e.touches.length === 1 && isDragging) {
          const dx = e.touches[0].clientX - lastX;
          const dy = e.touches[0].clientY - lastY;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
          spherical.theta -= dx * 0.007;
          spherical.phi -= dy * 0.007;
          applySpherical();
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (lastPinchDist && dist > 0) {
            syncFromCamera();
            spherical.radius *= lastPinchDist / dist;
            applySpherical();
          }
          lastPinchDist = dist;
        }
      };

      const onTouchEnd = () => {
        isDragging = false;
        lastPinchDist = null;
      };

      const onContextMenu = (e) => e.preventDefault();

      domElement.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      domElement.addEventListener('wheel', onWheel, { passive: false });
      domElement.addEventListener('touchstart', onTouchStart, { passive: true });
      domElement.addEventListener('touchmove', onTouchMove, { passive: true });
      domElement.addEventListener('touchend', onTouchEnd);
      domElement.addEventListener('contextmenu', onContextMenu);

      applySpherical();

      return {
        target,
        syncFromCamera,
        setView: (posVec, nextTarget) => {
          if (nextTarget) target.copy(nextTarget);
          camera.position.copy(posVec);
          syncFromCamera();
          applySpherical();
        },
        zoomBy: (factor) => {
          syncFromCamera();
          spherical.radius *= factor;
          applySpherical();
        },
        update: () => {
          if (!isDragging && (Math.abs(dampingTheta) > 0.0001 || Math.abs(dampingPhi) > 0.0001)) {
            spherical.theta += dampingTheta;
            spherical.phi += dampingPhi;
            dampingTheta *= 0.88;
            dampingPhi *= 0.88;
            applySpherical();
          }
        },
        dispose: () => {
          domElement.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          domElement.removeEventListener('wheel', onWheel);
          domElement.removeEventListener('touchstart', onTouchStart);
          domElement.removeEventListener('touchmove', onTouchMove);
          domElement.removeEventListener('touchend', onTouchEnd);
          domElement.removeEventListener('contextmenu', onContextMenu);
        }
      };
    }

    function createBrushedMetalTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#c9d2de';
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y++) {
        const shade = 180 + ((y * 37) % 48);
        ctx.fillStyle = `rgb(${shade},${shade + 4},${shade + 10})`;
        ctx.fillRect(0, y, 256, 1);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function createCarbonWeaveTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 64, 64);
      for (let y = 0; y < 64; y += 8) {
        for (let x = 0; x < 64; x += 8) {
          ctx.fillStyle = ((x + y) / 8) % 2 === 0 ? '#1e293b' : '#334155';
          ctx.fillRect(x, y, 7, 3);
          ctx.fillStyle = '#090d16';
          ctx.fillRect(x, y + 4, 7, 3);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(10, 10);
      return tex;
    }

    function disposeObject3D(root) {
      if (!root) return;
      root.traverse((node) => {
        if (node.geometry) node.geometry.dispose();
        if (node.material) {
          const list = Array.isArray(node.material) ? node.material : [node.material];
          list.forEach((m) => {
            if (m.map) m.map.dispose();
            if (m.envMap) m.envMap.dispose();
            m.dispose();
          });
        }
      });
    }

    function applyFeaVertexColors(geometry) {
      const pos = geometry.attributes.position;
      if (!pos) return;
      geometry.computeBoundingBox();
      const bb = geometry.boundingBox;
      const minY = bb ? bb.min.y : -1;
      const maxY = bb ? bb.max.y : 1;
      const spanY = Math.max(0.001, maxY - minY);
      const colors = new Float32Array(pos.count * 3);
      const color = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const stress = THREE.MathUtils.clamp(
          ((y - minY) / spanY) * 0.62 + (Math.abs(x) + Math.abs(z)) * 0.08,
          0,
          1
        );
        color.setHSL(0.62 - stress * 0.60, 0.92, 0.52);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }

    function parseAsciiStlToGeometry(text) {
      const vertices = [];
      const vertexRegex = /vertex\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)\s+([+-]?\d*\.?\d+(?:[eE][+-]?\d+)?)/g;
      let match;
      while ((match = vertexRegex.exec(text)) !== null) {
        vertices.push(parseFloat(match[1]), parseFloat(match[2]), parseFloat(match[3]));
      }
      if (vertices.length < 9) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function parseObjToGeometry(text) {
      const rawVerts = [];
      const triVerts = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('v ')) {
          const parts = trimmed.split(/\s+/);
          if (parts.length >= 4) {
            rawVerts.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
          }
        } else if (trimmed.startsWith('f ')) {
          const parts = trimmed.slice(2).trim().split(/\s+/);
          const idxList = parts
            .map((tok) => {
              const vIdx = parseInt(tok.split('/')[0], 10);
              return vIdx < 0 ? rawVerts.length + vIdx : vIdx - 1;
            })
            .filter((idx) => idx >= 0 && idx < rawVerts.length);
          for (let i = 1; i + 1 < idxList.length; i++) {
            const a = rawVerts[idxList[0]];
            const b = rawVerts[idxList[i]];
            const c = rawVerts[idxList[i + 1]];
            triVerts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
          }
        }
      }
      if (triVerts.length < 9) return null;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(triVerts, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function exportGroupToAsciiStl(group, solidName) {
      const lines = [`solid ${solidName}`];
      const vA = new THREE.Vector3();
      const vB = new THREE.Vector3();
      const vC = new THREE.Vector3();
      const cb = new THREE.Vector3();
      const ab = new THREE.Vector3();

      group.updateMatrixWorld(true);
      group.traverse((obj) => {
        if (!obj.isMesh || !obj.visible || !obj.geometry) return;
        const geo = obj.geometry;
        const pos = geo.attributes.position;
        if (!pos) return;
        const index = geo.index;
        const triCount = index ? index.count / 3 : pos.count / 3;

        for (let t = 0; t < triCount; t++) {
          const i0 = index ? index.getX(t * 3) : t * 3;
          const i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
          const i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;

          vA.fromBufferAttribute(pos, i0).applyMatrix4(obj.matrixWorld);
          vB.fromBufferAttribute(pos, i1).applyMatrix4(obj.matrixWorld);
          vC.fromBufferAttribute(pos, i2).applyMatrix4(obj.matrixWorld);

          cb.subVectors(vC, vB);
          ab.subVectors(vA, vB);
          cb.cross(ab).normalize();

          lines.push(`  facet normal ${cb.x.toFixed(6)} ${cb.y.toFixed(6)} ${cb.z.toFixed(6)}`);
          lines.push('    outer loop');
          lines.push(`      vertex ${vA.x.toFixed(6)} ${vA.y.toFixed(6)} ${vA.z.toFixed(6)}`);
          lines.push(`      vertex ${vB.x.toFixed(6)} ${vB.y.toFixed(6)} ${vB.z.toFixed(6)}`);
          lines.push(`      vertex ${vC.x.toFixed(6)} ${vC.y.toFixed(6)} ${vC.z.toFixed(6)}`);
          lines.push('    endloop');
          lines.push('  endfacet');
        }
      });
      lines.push(`endsolid ${solidName}`);
      return lines.join('\n');
    }

      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const envTexRef = useRef(null);
      const orbitRef = useRef(null);
      const assemblyRootRef = useRef(null);
      const subsystemGroupsRef = useRef({});
      const animatedPartsRef = useRef({ crank: null, pistons: [], valves: [], turbopumps: [] });
      const photoMeshRef = useRef(null);
      const clipPlaneRef = useRef(new THREE.Plane(new THREE.Vector3(0, -1, 0), 999));
      const sectionCapRef = useRef(null);
      const fallback2dCanvasRef = useRef(null);

      const easedExplodeRef = useRef(explodePercent);
      const easedSliceRef = useRef(slicePercent);
      const explodeAnimRef = useRef({ from: explodePercent, to: explodePercent, elapsed: 1, duration: 1.0 });
      const sliceAnimRef = useRef({ from: slicePercent, to: slicePercent, elapsed: 1, duration: 1.0 });

      useEffect(() => {
        explodeAnimRef.current = {
          from: easedExplodeRef.current,
          to: explodePercent,
          elapsed: 0,
          duration: 1.0
        };
      }, [explodePercent]);

      useEffect(() => {
        sliceAnimRef.current = {
          from: easedSliceRef.current,
          to: slicePercent,
          elapsed: 0,
          duration: 1.0
        };
      }, [slicePercent]);

      const animStateRef = useRef({
        turntableSpin,
        turntableSec: THREE.MathUtils.clamp(turntableSec || 9, 6, 12),
        mechanicalMotion,
        domain,
        renderMode,
        sliceAxis,
        params
      });
      useEffect(() => {
        animStateRef.current = {
          turntableSpin,
          turntableSec: THREE.MathUtils.clamp(turntableSec || 9, 6, 12),
          mechanicalMotion,
          domain,
          renderMode,
          sliceAxis,
          params
        };
      }, [turntableSpin, turntableSec, mechanicalMotion, domain, renderMode, sliceAxis, params]);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const w = Math.max(300, container.clientWidth || 680);
        const h = Math.max(300, container.clientHeight || 460);

        let webglReady = false;
        let renderer = null;
        let scene = null;
        let camera = null;
        let orbit = null;
        let envTex = null;

        try {
          if (typeof THREE === 'undefined' || !THREE.WebGLRenderer) {
            throw new Error('Three.js global not available');
          }

          scene = new THREE.Scene();
          sceneRef.current = scene;

          envTex = createStudioEnvironmentTexture();
          envTexRef.current = envTex;
          scene.environment = envTex;
          scene.environmentIntensity = 0.85;

          camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 180);
          camera.position.set(7.2, 5.2, 7.6);
          cameraRef.current = camera;

          renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            preserveDrawingBuffer: true,
            powerPreference: 'high-performance'
          });
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.08;
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.localClippingEnabled = true;
          rendererRef.current = renderer;
          container.appendChild(renderer.domElement);

          orbit = createSimpleOrbitController(camera, renderer.domElement, new THREE.Vector3(0, 0.25, 0));
          orbitRef.current = orbit;

          const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x0f172a, 0.55);
          scene.add(hemiLight);

          const warmKeyLight = new THREE.DirectionalLight(0xffdfa8, 2.6);
          warmKeyLight.position.set(10, 14, 11);
          warmKeyLight.castShadow = true;
          warmKeyLight.shadow.mapSize.width = 1024;
          warmKeyLight.shadow.mapSize.height = 1024;
          warmKeyLight.shadow.camera.near = 2;
          warmKeyLight.shadow.camera.far = 40;
          warmKeyLight.shadow.radius = 4;
          scene.add(warmKeyLight);

          const coolRimLight = new THREE.DirectionalLight(0x7dd3fc, 1.15);
          coolRimLight.position.set(-11, 6, -9);
          scene.add(coolRimLight);

          const grid = new THREE.GridHelper(18, 36, 0x283b5c, 0x101827);
          grid.position.y = -2.05;
          scene.add(grid);

          const axes = new THREE.AxesHelper(1.75);
          axes.position.set(-6.2, -2.02, -6.2);
          scene.add(axes);

          const capGeo = new THREE.PlaneGeometry(7.2, 7.2);
          const capMat = new THREE.MeshBasicMaterial({
            color: 0xf59e0b,
            transparent: true,
            opacity: 0.14,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          const capMesh = new THREE.Mesh(capGeo, capMat);
          capMesh.visible = false;
          scene.add(capMesh);
          sectionCapRef.current = capMesh;

          webglReady = true;
          if (onDiagnosticsUpdate) {
            onDiagnosticsUpdate({ rendererMode: 'WebGL2 ACES (40°)', fps: 60, meshCount: 0 });
          }
        } catch (_err) {
          webglReady = false;
          const fallbackCanvas = document.createElement('canvas');
          fallbackCanvas.width = w;
          fallbackCanvas.height = h;
          fallbackCanvas.className = 'w-full h-full block';
          container.appendChild(fallbackCanvas);
          fallback2dCanvasRef.current = fallbackCanvas;
          if (onDiagnosticsUpdate) {
            onDiagnosticsUpdate({ rendererMode: 'Fallback 2D Canvas', fps: 60, meshCount: 12 });
          }
        }

        const resizeObserver = new ResizeObserver(() => {
          if (!containerRef.current) return;
          const nw = Math.max(260, containerRef.current.clientWidth);
          const nh = Math.max(240, containerRef.current.clientHeight);
          if (webglReady && rendererRef.current && cameraRef.current) {
            cameraRef.current.aspect = nw / nh;
            cameraRef.current.updateProjectionMatrix();
            rendererRef.current.setSize(nw, nh);
          } else if (fallback2dCanvasRef.current) {
            fallback2dCanvasRef.current.width = nw;
            fallback2dCanvasRef.current.height = nh;
          }
        });
        resizeObserver.observe(container);

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        const onPointerDown = (e) => {
          downPos = { x: e.clientX, y: e.clientY };
        };

        const onPointerUp = (e) => {
          if (!webglReady || !renderer || !camera || !assemblyRootRef.current) return;
          const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
          if (dist > 6) return;
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(assemblyRootRef.current.children, true);
          const hitMesh = hits.find((h) => h.object && h.object.visible && h.object.userData.subsystem);
          if (hitMesh && onSelectSubsystem) {
            onSelectSubsystem(hitMesh.object.userData.subsystem);
          }
        };

        if (webglReady && renderer) {
          renderer.domElement.addEventListener('pointerdown', onPointerDown);
          renderer.domElement.addEventListener('pointerup', onPointerUp);
        }

        const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

        let frameId = null;
        let prevTime = performance.now();
        let simTime = 0;
        let framesSinceSample = 0;
        let lastFpsSample = prevTime;

        const animate = (now) => {
          frameId = requestAnimationFrame(animate);
          const rawDt = (now - prevTime) / 1000;
          prevTime = now;
          const dt = Math.min(0.05, Math.max(0.001, rawDt));

          const {
            turntableSpin: spin,
            turntableSec: spinPeriod,
            mechanicalMotion: motion,
            sliceAxis: curAxis
          } = animStateRef.current;

          framesSinceSample++;
          if (now - lastFpsSample >= 750) {
            const measuredFps = Math.max(15, Math.min(120, Math.round((framesSinceSample * 1000) / (now - lastFpsSample))));
            let count = 0;
            if (assemblyRootRef.current) {
              assemblyRootRef.current.traverse((o) => {
                if (o.isMesh && o.visible) count++;
              });
            }
            if (onDiagnosticsUpdate) {
              onDiagnosticsUpdate({
                rendererMode: webglReady ? 'WebGL2 ACES (40°)' : 'Fallback 2D Canvas',
                fps: measuredFps,
                meshCount: webglReady ? count : 14
              });
            }
            framesSinceSample = 0;
            lastFpsSample = now;
          }

          const expAnim = explodeAnimRef.current;
          if (expAnim.elapsed < expAnim.duration) {
            expAnim.elapsed = Math.min(expAnim.duration, expAnim.elapsed + dt);
            const k = easeInOutCubic(expAnim.elapsed / expAnim.duration);
            easedExplodeRef.current = expAnim.from + (expAnim.to - expAnim.from) * k;
          } else {
            easedExplodeRef.current = expAnim.to;
          }

          const slcAnim = sliceAnimRef.current;
          if (slcAnim.elapsed < slcAnim.duration) {
            slcAnim.elapsed = Math.min(slcAnim.duration, slcAnim.elapsed + dt);
            const k = easeInOutCubic(slcAnim.elapsed / slcAnim.duration);
            easedSliceRef.current = slcAnim.from + (slcAnim.to - slcAnim.from) * k;
          } else {
            easedSliceRef.current = slcAnim.to;
          }

          const curExplode = easedExplodeRef.current;
          const curSlice = easedSliceRef.current;

          if (webglReady && renderer && scene && camera) {
            if (assemblyRootRef.current && spin) {
              const radPerSec = (Math.PI * 2) / THREE.MathUtils.clamp(spinPeriod, 6, 12);
              assemblyRootRef.current.rotation.y += radPerSec * dt;
            }

            const expFactor = curExplode / 100;
            Object.values(subsystemGroupsRef.current).forEach((grp) => {
              if (!grp || !grp.userData.explodeVec) return;
              const v = grp.userData.explodeVec;
              grp.position.set(v.x * expFactor, v.y * expFactor, v.z * expFactor);
            });

            const activeSlice = curSlice > 0.1;
            const cutWorld = activeSlice ? 3.8 * (1 - (curSlice / 100) * 1.85) : 999;
            clipPlaneRef.current.constant = cutWorld;
            if (sectionCapRef.current) {
              sectionCapRef.current.visible = activeSlice;
              if (curAxis === 'X') sectionCapRef.current.position.set(cutWorld, 0, 0);
              else if (curAxis === 'Y') sectionCapRef.current.position.set(0, cutWorld, 0);
              else sectionCapRef.current.position.set(0, 0, cutWorld);
            }

            if (motion) {
              simTime += dt * 4.2;
              const anim = animatedPartsRef.current;
              if (anim.crank) {
                anim.crank.rotation.x = simTime;
              }
              anim.pistons.forEach((pMesh, idx) => {
                const phase = simTime + (idx % 4) * (Math.PI / 2) + (idx >= 4 ? Math.PI / 4 : 0);
                const strokeOffset = Math.sin(phase) * 0.22;
                const bankSign = idx < 4 ? 1 : -1;
                pMesh.position.y = pMesh.userData.baseY + strokeOffset * 0.707;
                pMesh.position.z = pMesh.userData.baseZ + bankSign * strokeOffset * 0.707;
              });
              anim.valves.forEach((vMesh, idx) => {
                const lift = Math.max(0, Math.sin(simTime * 0.5 + idx * 0.8)) * 0.09;
                vMesh.position.y = vMesh.userData.baseY - lift;
              });
              anim.turbopumps.forEach((tp, idx) => {
                tp.rotation.z = simTime * (idx === 0 ? 2.4 : -2.4);
              });
            }

            if (orbit) orbit.update();
            renderer.render(scene, camera);
          } else if (fallback2dCanvasRef.current) {
            const c2d = fallback2dCanvasRef.current;
            const ctx = c2d.getContext('2d');
            if (ctx) {
              simTime += motion ? dt * 2.5 : 0;
              ctx.clearRect(0, 0, c2d.width, c2d.height);
              ctx.strokeStyle = '#38BDF8';
              ctx.lineWidth = 2;
              const cx = c2d.width / 2;
              const cy = c2d.height / 2;
              const r = 90 + (curExplode / 100) * 35;
              ctx.strokeRect(cx - r, cy - r * 0.65, r * 2, r * 1.3);
              ctx.beginPath();
              ctx.arc(cx + Math.cos(simTime) * 28, cy + Math.sin(simTime) * 18, 28, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
        };
        frameId = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(frameId);
          resizeObserver.disconnect();
          if (webglReady && renderer) {
            renderer.domElement.removeEventListener('pointerdown', onPointerDown);
            renderer.domElement.removeEventListener('pointerup', onPointerUp);
          }
          if (orbit) orbit.dispose();
          disposeObject3D(assemblyRootRef.current);
          disposeObject3D(photoMeshRef.current);
          if (envTex) envTex.dispose();
          if (renderer) renderer.dispose();
          if (renderer && renderer.domElement && renderer.domElement.parentNode === container) {
            container.removeChild(renderer.domElement);
          }
          if (fallback2dCanvasRef.current && fallback2dCanvasRef.current.parentNode === container) {
            container.removeChild(fallback2dCanvasRef.current);
          }
        };
      }, [onSelectSubsystem, onDiagnosticsUpdate]);

      useEffect(() => {
        if (!cameraCommand || !cameraRef.current || !orbitRef.current) return;
        const cam = cameraRef.current;
        const orb = orbitRef.current;
        const dist = 8.2;

        if (cameraCommand.type === 'PRESET') {
          if (cameraCommand.preset === 'ISO') orb.setView(new THREE.Vector3(dist * 0.86, dist * 0.64, dist * 0.90), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'TOP') orb.setView(new THREE.Vector3(0, dist * 1.25, 0.01), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'FRONT') orb.setView(new THREE.Vector3(0, dist * 0.22, dist * 1.22), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'RIGHT') orb.setView(new THREE.Vector3(dist * 1.22, dist * 0.22, 0), new THREE.Vector3(0, 0.25, 0));
          else if (cameraCommand.preset === 'SECTION') orb.setView(new THREE.Vector3(dist * 0.95, dist * 0.42, dist * 0.45), new THREE.Vector3(0, 0.25, 0));
          cam.updateProjectionMatrix();
        } else if (cameraCommand.type === 'ZOOM') {
          orb.zoomBy(cameraCommand.factor);
        }
      }, [cameraCommand]);

      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        if (assemblyRootRef.current) {
          scene.remove(assemblyRootRef.current);
          disposeObject3D(assemblyRootRef.current);
          assemblyRootRef.current = null;
        }
        subsystemGroupsRef.current = {};
        animatedPartsRef.current = { crank: null, pistons: [], valves: [], turbopumps: [] };

        const plane = clipPlaneRef.current;
        const cap = sectionCapRef.current;
        const activeSlice = slicePercent > 0;
        const cutWorld = activeSlice ? 3.8 * (1 - (slicePercent / 100) * 1.85) : 999;

        if (sliceAxis === 'X') {
          plane.normal.set(-1, 0, 0);
          if (cap) {
            cap.position.set(cutWorld, 0, 0);
            cap.rotation.set(0, Math.PI / 2, 0);
          }
        } else if (sliceAxis === 'Y') {
          plane.normal.set(0, -1, 0);
          if (cap) {
            cap.position.set(0, cutWorld, 0);
            cap.rotation.set(Math.PI / 2, 0, 0);
          }
        } else {
          plane.normal.set(0, 0, -1);
          if (cap) {
            cap.position.set(0, 0, cutWorld);
            cap.rotation.set(0, 0, 0);
          }
        }
        plane.constant = cutWorld;
        if (cap) cap.visible = activeSlice;

        const clippingPlanes = activeSlice ? [plane] : [];
        const alloy = ALLOYS.find((a) => a.id === params.materialId) || ALLOYS[0];
        const brushedTex = createBrushedMetalTexture();
        const carbonTex = createCarbonWeaveTexture();

        const buildMaterial = (baseHex, subsystemName, opts = {}) => {
          const isSelected = selectedSubsystem === subsystemName;
          const color = isSelected ? 0x38bdf8 : baseHex;

          if (renderMode === 'wireframe' || renderMode === 'lattice-3dp') {
            return new THREE.MeshBasicMaterial({
              color: renderMode === 'lattice-3dp' ? 0x10b981 : color,
              wireframe: true,
              clippingPlanes
            });
          }
          if (renderMode === 'xray') {
            const isInternal = opts.internal === true;
            return new THREE.MeshBasicMaterial({
              color: isInternal ? 0xf59e0b : color,
              transparent: true,
              opacity: isInternal ? 0.88 : 0.24,
              depthWrite: isInternal,
              side: THREE.DoubleSide,
              clippingPlanes
            });
          }
          if (renderMode === 'fea-field') {
            return new THREE.MeshStandardMaterial({
              vertexColors: true,
              roughness: 0.28,
              metalness: 0.42,
              side: THREE.DoubleSide,
              clippingPlanes
            });
          }

          return new THREE.MeshStandardMaterial({
            color,
            map: opts.carbon ? carbonTex : opts.brushed ? brushedTex : null,
            metalness: opts.metalness !== undefined ? opts.metalness : alloy.metalness,
            roughness: opts.roughness !== undefined ? opts.roughness : alloy.roughness,
            envMapIntensity: 0.9,
            emissive: opts.emissive || 0x000000,
            emissiveIntensity: opts.emissiveIntensity || 0,
            side: THREE.DoubleSide,
            clippingPlanes
          });
        };

        const root = new THREE.Group();

        const createSubGroup = (name, explodeVec) => {
          const g = new THREE.Group();
          g.name = name;
          g.userData.explodeVec = new THREE.Vector3(explodeVec[0], explodeVec[1], explodeVec[2]);
          const hiddenEye = visibilityMap[name] === false;
          const hiddenIso = isolatedSubsystem && isolatedSubsystem !== name;
          g.visible = !hiddenEye && !hiddenIso;
          subsystemGroupsRef.current[name] = g;
          root.add(g);
          return g;
        };

        const addPart = (parent, geo, hex, subsystemName, pos, rot, opts = {}) => {
          if (renderMode === 'fea-field') applyFeaVertexColors(geo);
          const mesh = new THREE.Mesh(geo, buildMaterial(hex, subsystemName, opts));
          mesh.userData.subsystem = subsystemName;
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          if (pos) mesh.position.set(pos[0], pos[1], pos[2]);
          if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
          parent.add(mesh);

          if (renderMode === 'wireframe') {
            const edges = new THREE.EdgesGeometry(geo, 28);
            const line = new THREE.LineSegments(
              edges,
              new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45, clippingPlanes })
            );
            line.position.copy(mesh.position);
            line.rotation.copy(mesh.rotation);
            parent.add(line);
          }
          return mesh;
        };

        const boreScale = THREE.MathUtils.clamp(params.boreIn / 4.0, 0.82, 1.55);
        const strokeScale = THREE.MathUtils.clamp(params.strokeIn / 3.48, 0.85, 1.45);
        const wallScale = THREE.MathUtils.clamp(params.wallIn / 0.28, 0.75, 1.65);

        if (domain === 'sbc-350-v16' || domain === 'sbc-350-v20') {
          const isV20 = domain === 'sbc-350-v20';
          const blockLen = 3.8 * boreScale;
          const blockH = 1.45 * strokeScale;
          const blockW = 1.75 * wallScale;

          const gBlock = createSubGroup('Engine Block & Sump', [0, -0.45, 0]);
          addPart(gBlock, new THREE.BoxGeometry(blockLen, blockH, blockW), alloy.color, 'Engine Block & Sump', [0, 0, 0], null, { brushed: true });

          for (let bankIdx = 0; bankIdx < 2; bankIdx++) {
            const sign = bankIdx === 0 ? 1 : -1;
            for (let c = 0; c < 4; c++) {
              const xOff = ((c - 1.5) / 3) * (blockLen * 0.72) + (bankIdx === 1 ? 0.14 : -0.14);
              const sleeveGeo = new THREE.CylinderGeometry(0.32 * boreScale, 0.32 * boreScale, blockH * 0.92, 24, 1, true);
              addPart(gBlock, sleeveGeo, 0x94a3b8, 'Engine Block & Sump', [xOff, 0.35, sign * 0.42], [sign * 0.785, 0, 0], { metalness: 0.92, roughness: 0.18 });
            }
          }

          addPart(gBlock, new THREE.BoxGeometry(blockLen * 0.94, 0.52, blockW * 0.82), 0x1e293b, 'Engine Block & Sump', [0, -blockH * 0.65, 0], null, { brushed: true });
          const boltCount = Math.min(24, Math.max(8, Math.round(params.boltCount)));
          for (let b = 0; b < boltCount; b++) {
            const side = b % 2 === 0 ? 1 : -1;
            const bx = (((Math.floor(b / 2)) / Math.max(1, boltCount / 2 - 1)) - 0.5) * blockLen * 0.88;
            addPart(gBlock, new THREE.CylinderGeometry(0.035, 0.035, 0.09, 6), 0xfbbf24, 'Engine Block & Sump', [bx, -blockH * 0.48, side * blockW * 0.43]);
          }

          const gCrank = createSubGroup('Crankshaft & Pistons', [0, -1.35, 0]);
          const crankGroup = new THREE.Group();
          crankGroup.position.set(0, -0.25, 0);
          const shaftMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.16, blockLen * 1.12, 20),
            buildMaterial(0xcbd5e1, 'Crankshaft & Pistons', { internal: true, metalness: 0.94, roughness: 0.15 })
          );
          shaftMesh.rotation.z = Math.PI / 2;
          shaftMesh.userData.subsystem = 'Crankshaft & Pistons';
          crankGroup.add(shaftMesh);

          for (let wIdx = 0; wIdx < 6; wIdx++) {
            const wx = ((wIdx / 5) - 0.5) * blockLen * 0.85;
            const cw = new THREE.Mesh(
              new THREE.BoxGeometry(0.12, 0.68, 0.42),
              buildMaterial(0x64748b, 'Crankshaft & Pistons', { internal: true })
            );
            cw.position.set(wx, 0, 0);
            cw.rotation.x = (wIdx * Math.PI) / 3;
            cw.userData.subsystem = 'Crankshaft & Pistons';
            crankGroup.add(cw);
          }
          gCrank.add(crankGroup);
          animatedPartsRef.current.crank = crankGroup;

          for (let bankIdx = 0; bankIdx < 2; bankIdx++) {
            const sign = bankIdx === 0 ? 1 : -1;
            for (let c = 0; c < 4; c++) {
              const xOff = ((c - 1.5) / 3) * (blockLen * 0.72) + (bankIdx === 1 ? 0.14 : -0.14);
              const pGeo = new THREE.CylinderGeometry(0.28 * boreScale, 0.28 * boreScale, 0.34, 24);
              const pMesh = addPart(
                gCrank,
                pGeo,
                0xe2e8f0,
                'Crankshaft & Pistons',
                [xOff, 0.42, sign * 0.48],
                [sign * 0.785, 0, 0],
                { internal: true, metalness: 0.95, roughness: 0.16 }
              );
              pMesh.userData.baseY = 0.42;
              pMesh.userData.baseZ = sign * 0.48;
              animatedPartsRef.current.pistons.push(pMesh);
            }
          }

          const gHeads = createSubGroup('CNC Cylinder Heads', [0, 1.15, 0]);
          [-1, 1].forEach((sign) => {
            addPart(
              gHeads,
              new THREE.BoxGeometry(blockLen * 0.96, 0.62, 0.98 * wallScale),
              0x94a3b8,
              'CNC Cylinder Heads',
              [0, 0.88, sign * 0.78],
              [sign * 0.785, 0, 0],
              { brushed: true, metalness: 0.9, roughness: 0.2 }
            );
            for (let hb = 0; hb < 5; hb++) {
              const hx = ((hb / 4) - 0.5) * blockLen * 0.84;
              addPart(
                gHeads,
                new THREE.CylinderGeometry(0.045, 0.045, 0.14, 12),
                0xf59e0b,
                'CNC Cylinder Heads',
                [hx, 1.15, sign * 1.02],
                [sign * 0.785, 0, 0]
              );
            }
          });

          const gValve = createSubGroup('Valvetrain', [0, 2.05, 0]);
          [-1, 1].forEach((sign) => {
            for (let v = 0; v < 8; v++) {
              const vx = ((v / 7) - 0.5) * blockLen * 0.82;
              const spring = addPart(
                gValve,
                new THREE.CylinderGeometry(0.065, 0.065, 0.26, 12),
                0xfbbf24,
                'Valvetrain',

        if (uploadedMeshAsset && uploadedMeshAsset.geometry) {

          const customMesh = new THREE.Mesh(

            buildMaterial(0x10b981, 'Uploaded Custom Mesh', { brushed: true })

          root.add(customMesh);
        }

        scene.add(root);
        assemblyRootRef.current = root;

        if (onExportStlReady) {
          onExportStlReady(() => exportGroupToAsciiStl(root, `${domain}_v20_assembly`));
        }

        return () => {
          brushedTex.dispose();
          carbonTex.dispose();
        };
      }, [
        domain,
        renderMode,
        params,
        sliceAxis,
        slicePercent,
        visibilityMap,
        isolatedSubsystem,
        selectedSubsystem,
        uploadedMeshAsset,
        onExportStlReady
      ]);

      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;

        if (photoMeshRef.current) {
          scene.remove(photoMeshRef.current);
          disposeObject3D(photoMeshRef.current);
          photoMeshRef.current = null;
        }

        if (!calibratedPhoto.visible || !calibratedPhoto.url) return;

        let cancelled = false;
        const loader = new THREE.TextureLoader();
        loader.load(calibratedPhoto.url, (texture) => {
          if (cancelled || !sceneRef.current) {
            texture.dispose();
            return;
          }
          const aspect = calibratedPhoto.naturalWidth && calibratedPhoto.naturalHeight
            ? calibratedPhoto.naturalWidth / calibratedPhoto.naturalHeight
            : 1.5;
          const planeH = 4.6;
          const planeW = planeH * aspect;
          const geo = new THREE.PlaneGeometry(planeW, planeH);
          const mat = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            opacity: calibratedPhoto.opacity,
            side: THREE.DoubleSide
          });
          const planeMesh = new THREE.Mesh(geo, mat);
          planeMesh.position.set(0, 0.3, -2.6);
          sceneRef.current.add(planeMesh);
          photoMeshRef.current = planeMesh;
        });

        return () => {
          cancelled = true;

    // =========================================================================
    // 6. MAIN MERGED STUDIO APPLICATION (v16 SBC-350 MODELER + v20 QADS STUDIO)
    // =========================================================================
    function StudioApp() {
      const [domain, setDomain] = useState('sbc-350-v20');
      const [activeRoom, setActiveRoom] = useState('build');
      const [renderMode, setRenderMode] = useState('shaded');
      const [units, setUnits] = useState('IN');
      const [leftTreeOpen, setLeftTreeOpen] = useState(true);
      const [rightInspectorOpen, setRightInspectorOpen] = useState(true);
      const [standardsOpen, setStandardsOpen] = useState(false);

      const [diagnostics, setDiagnostics] = useState({
        rendererMode: 'WebGL2 Studio',
        fps: 60,
        meshCount: 0
      });

      const [params, setParams] = useState({
        boreIn: 4.060,
        strokeIn: 3.480,
        wallIn: 0.28,
        boltCount: 18,
        filletIn: 0.35,
        materialId: 'al7075'
      });

      // v16 SBC-350 Modeler specific states
      const [activeV16PresetId, setActiveV16PresetId] = useState('v16_cast_350_base');
      const [boltSequenceStep, setBoltSequenceStep] = useState(1);
      const [boltTorquePass, setBoltTorquePass] = useState('PASS_3_FINAL');
      const [deckHeightIn, setDeckHeightIn] = useState(9.000);

      const [explodePercent, setExplodePercent] = useState(0);
      const [turntableSpin, setTurntableSpin] = useState(false);
      const [turntableSec, setTurntableSec] = useState(9);
      const [mechanicalMotion, setMechanicalMotion] = useState(true);
      const [sliceAxis, setSliceAxis] = useState('Y');
      const [slicePercent, setSlicePercent] = useState(0);
      const [latticeDensity, setLatticeDensity] = useState(35);

      const [visibilityMap, setVisibilityMap] = useState({});
      const [isolatedSubsystem, setIsolatedSubsystem] = useState(null);
      const [selectedSubsystem, setSelectedSubsystem] = useState('Engine Block & Sump');

      // Matrix & Library State
      const [matrixSubTab, setMatrixSubTab] = useState('vehicles');
      const [activeMatrixItems, setActiveMatrixItems] = useState(() => [
        ...VEHICLE_MATRIX_LIBRARY.slice(0, 6),
        ...ACCESSORIES_CATALOG.slice(0, 4)
      ]);
      const [matrixSearch, setMatrixSearch] = useState('');
      const [matrixCategory, setMatrixCategory] = useState('ALL');
      const [matrixStatusFilter, setMatrixStatusFilter] = useState('ALL');

      // Photo Calibration State
      const [calibratedPhoto, setCalibratedPhoto] = useState({
        url: null,
        name: '',
        naturalWidth: 0,
        naturalHeight: 0,
        knownSpanIn: 14.0,
        measuredPx: 520,
        opacity: 0.45,
        visible: false
      });

      // Drawing Title Block State
      const [titleMeta, setTitleMeta] = useState({
        drawingNumber: 'QADS-SBC350-V16-V20-001',
        revision: 'R20.4+V16',
        engineer: 'PHOENIX / QADS STUDIO'
      });

      // Jesse Standard Cinematic Video Graphics State
      const [jesseShotId, setJesseShotId] = useState('shot_1_establish');
      const [jessePlaying, setJessePlaying] = useState(true);
      const [jesseScrubPct, setJesseScrubPct] = useState(25);
      const [jesseWarmGoldGrade, setJesseWarmGoldGrade] = useState(true);
      const [jesseFineGrain, setJesseFineGrain] = useState(true);
      const [jesseSourceMediaUrl, setJesseSourceMediaUrl] = useState(null);
      const [jesseSourceMediaName, setJesseSourceMediaName] = useState('');
      const prevJesseMediaUrlRef = useRef(null);

      // Gemini AI Co-Pilot State
      const [geminiApiKey, setGeminiApiKey] = useState('');
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        {
          role: 'assistant',
          text: 'Merged SBC-350 v16 + v20 + Quantum Aerospace Studio ready. Switch between v16 SBC-350 presets, #1–#17 head bolt torque passes, 3D PBR views, and ASME blueprints.'
        }
      ]);

      const [uploadedMeshAsset, setUploadedMeshAsset] = useState(null);
      const [uploadedCount, setUploadedCount] = useState(0);
      const [cameraCommand, setCameraCommand] = useState(null);
      const [toast, setToast] = useState('');

      const globalFileInputRef = useRef(null);
      const photoInputRef = useRef(null);
      const blueprintSvgRef = useRef(null);
      const getStlRef = useRef(null);
      const prevPhotoUrlRef = useRef(null);

      const notify = useCallback((msg) => setToast(msg), []);

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(''), 3400);
        return () => clearTimeout(timer);
      }, [toast]);

      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (saved.domain) setDomain(saved.domain);
          if (saved.activeRoom) setActiveRoom(saved.activeRoom);
          if (saved.renderMode) setRenderMode(saved.renderMode);
          if (saved.units === 'IN' || saved.units === 'MM') setUnits(saved.units);
          if (saved.params) setParams((p) => ({ ...p, ...saved.params }));
          if (typeof saved.explodePercent === 'number') setExplodePercent(saved.explodePercent);
          if (typeof saved.deckHeightIn === 'number') setDeckHeightIn(saved.deckHeightIn);
          if (saved.titleMeta) setTitleMeta((t) => ({ ...t, ...saved.titleMeta }));
          if (Array.isArray(saved.activeMatrixItems) && saved.activeMatrixItems.length > 0) {
            setActiveMatrixItems(saved.activeMatrixItems);
          }
        } catch (_e) {
          // Ignore invalid saved JSON
        }
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              domain,
              activeRoom,
              renderMode,
              units,
              params,
              explodePercent,
              deckHeightIn,
              titleMeta,
              activeMatrixItems
            })
          );
        } catch (_e) {
          // Ignore storage errors
        }
      }, [domain, activeRoom, renderMode, units, params, explodePercent, deckHeightIn, titleMeta, activeMatrixItems]);

      useEffect(() => {
        return () => {
          if (prevPhotoUrlRef.current) URL.revokeObjectURL(prevPhotoUrlRef.current);
          if (prevJesseMediaUrlRef.current) URL.revokeObjectURL(prevJesseMediaUrlRef.current);
        };
      }, []);

      useEffect(() => {
        if (!jessePlaying) return;
        const intervalMs = Math.round(1000 / 24);
        const timer = setInterval(() => {
          setJesseScrubPct((prev) => (prev >= 100 ? 0 : Number((prev + 0.5).toFixed(1))));
        }, intervalMs);
        return () => clearInterval(timer);
      }, [jessePlaying]);

      const activeJesseShot = useMemo(
        () => JESSE_SHOT_TEMPLATES.find((s) => s.id === jesseShotId) || JESSE_SHOT_TEMPLATES[0],
        [jesseShotId]
      );

      const composedJessePrompt = useMemo(() => {
        const alloy = ALLOYS.find((a) => a.id === params.materialId) || ALLOYS[0];
        return [
          `[24 fps] ${activeJesseShot.title}.`,
          `Camera: ${activeJesseShot.move}.`,
          `Optics: ${activeJesseShot.lens}.`,
          `Lighting: ${activeJesseShot.lighting}.`,
          `Color & Texture: ${jesseWarmGoldGrade ? 'Warm gold grade' : 'Neutral studio grade'}${jesseFineGrain ? ' with fine film grain' : ' with clean digital grain'}.`,
          `Subject & Integrity: Correct hands and no morphing, the band together in one live scene, ${activeJesseShot.emblemState}.`,
          `Hardware Context: ${domain.toUpperCase()} · ${alloy.name} · Bore ${params.boreIn.toFixed(3)} in · Bolt Sequence #1-#17 (never a circle).`,
          `Note: Veo is paywalled — free route uses real footage or stills with slow zoom.`
        ].join(' ');
      }, [activeJesseShot, jesseWarmGoldGrade, jesseFineGrain, domain, params.materialId, params.boreIn]);

      const formatDim = useCallback(
        (inches) => (units === 'MM' ? `${(inches * 25.4).toFixed(2)} mm` : `${Number(inches).toFixed(3)} in`),
        [units]
      );

      const telemetry = useMemo(() => {
        const alloy = ALLOYS.find((a) => a.id === params.materialId) || ALLOYS[0];
        const dispCid = Math.PI * Math.pow(params.boreIn / 2, 2) * params.strokeIn * 8;
        const dispLiters = dispCid * 0.0163871;
        const envelopeIn3 = params.boreIn * params.strokeIn * params.wallIn * 142;
        const massLb = envelopeIn3 * alloy.densityLbIn3;
        const cncHours = (4.2 + params.boltCount * 0.14 + (1 / Math.max(0.15, params.wallIn)) * 0.8) * alloy.cncFactor;
        const wallPass = params.wallIn >= 0.03;
        return {
          alloyName: alloy.name,
          yieldMPa: alloy.yieldMPa,
          maxTempC: alloy.maxTempC,
          dispStr: `${dispCid.toFixed(1)} cid (${dispLiters.toFixed(2)} L)`,
          massStr: units === 'MM' ? `${(massLb * 0.453592).toFixed(1)} kg` : `${massLb.toFixed(1)} lb`,
          cncHours: cncHours.toFixed(1),
          dmlsStatus: wallPass ? 'DMLS/CNC PASS' : 'THIN WALL WARN'
        };
      }, [params, units]);

      const applyV16Preset = (preset) => {
        setActiveV16PresetId(preset.id);
        setDomain('sbc-350-v16');
        setSelectedSubsystem(preset.subsystem);
        setParams({
          boreIn: preset.boreIn,
          strokeIn: preset.strokeIn,
          wallIn: preset.wallIn,
          boltCount: preset.boltCount,
          filletIn: preset.filletIn,
          materialId: preset.materialId
        });
        notify(`Loaded v16 Preset: ${preset.code}`);
      };

      const handleDomainSwitch = (nextDomain) => {
        setDomain(nextDomain);
        setIsolatedSubsystem(null);
        if (nextDomain === 'sbc-350-v16') {
          setSelectedSubsystem('Engine Block & Sump');
          setParams({ boreIn: 4.000, strokeIn: 3.480, wallIn: 0.25, boltCount: 17, filletIn: 0.25, materialId: 'chromoly4140' });
          notify('Loaded SBC-350 Engine v16');
        } else if (nextDomain === 'sbc-350-v20') {
          setSelectedSubsystem('Bellhousing & Flywheel');
          setParams({ boreIn: 4.060, strokeIn: 3.480, wallIn: 0.28, boltCount: 18, filletIn: 0.35, materialId: 'al7075' });
          notify('Loaded SBC-350 Engine v20');
        } else {
          setSelectedSubsystem('Regen Thrust Chamber');
          setParams({ boreIn: 5.800, strokeIn: 4.500, wallIn: 0.22, boltCount: 24, filletIn: 0.45, materialId: 'inconel625' });
          notify('Loaded Quantum Aerospace Vehicle v20');
        }
      };

      const handleRenderModeSelect = (modeId) => {
        setRenderMode(modeId);
        if (modeId === 'section' && slicePercent === 0) {
          setSlicePercent(45);
        }
        notify(`Render Mode: ${RENDER_MODES.find((m) => m.id === modeId)?.label || modeId}`);
      };

      const loadReferencePhoto = (file) => {
        const nextUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          if (prevPhotoUrlRef.current) URL.revokeObjectURL(prevPhotoUrlRef.current);
          prevPhotoUrlRef.current = nextUrl;
          setCalibratedPhoto((prev) => ({
            ...prev,
            url: nextUrl,
            name: file.name,
            naturalWidth: img.naturalWidth || 1024,
            naturalHeight: img.naturalHeight || 768,
            measuredPx: Math.max(120, Math.round((img.naturalWidth || 1024) * 0.55)),
            visible: true
          }));
          setActiveRoom('scale');
          notify(`Calibrated photo: ${file.name}`);
        };
        img.onerror = () => {
          URL.revokeObjectURL(nextUrl);
          notify(`Could not load photo: ${file.name}`);
        };
        img.src = nextUrl;
      };

      const setCustomMeshGeometry = (geo, fileName) => {
        if (!geo) return;
        geo.computeVertexNormals();
        geo.center();
        geo.computeBoundingSphere();
        const r = geo.boundingSphere ? geo.boundingSphere.radius : 1;
        if (r > 0) geo.scale(1.8 / r, 1.8 / r, 1.8 / r);
        setUploadedMeshAsset((prev) => {
          if (prev && prev.geometry) prev.geometry.dispose();
          return { name: fileName, geometry: geo };
        });
        notify(`Loaded 3D mesh: ${fileName}`);
      };

      const handleUniversalFiles = (fileList) => {
        if (!fileList || fileList.length === 0) return;
        Array.from(fileList).forEach((file) => {
          const lower = file.name.toLowerCase();
          setUploadedCount((c) => c + 1);

          if (/\.(png|jpg|jpeg|webp)$/.test(lower)) {
            loadReferencePhoto(file);
          } else if (lower.endsWith('.json')) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const parsed = JSON.parse(String(ev.target.result || '{}'));
                if (parsed.params) setParams((p) => ({ ...p, ...parsed.params }));
                if (parsed.domain) setDomain(parsed.domain);
                if (Array.isArray(parsed.accessories)) {
                  setActiveMatrixItems((prev) => {
                    const seen = new Set(prev.map((x) => x.id));
                    return [...parsed.accessories.filter((a) => a.id && !seen.has(a.id)), ...prev];
                  });
                }
                if (Array.isArray(parsed.partsMatrix)) setActiveMatrixItems(parsed.partsMatrix);
                notify(`Imported JSON preset/matrix: ${file.name}`);
              } catch (_e) {
                notify(`Invalid JSON: ${file.name}`);
              }
            };
            reader.readAsText(file);
          } else if (lower.endsWith('.stl')) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const geo = parseAsciiStlToGeometry(String(ev.target.result || ''));
              if (geo) setCustomMeshGeometry(geo, file.name);
              else notify(`Could not parse STL mesh: ${file.name}`);
            };
            reader.readAsText(file);
          } else if (lower.endsWith('.obj')) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const geo = parseObjToGeometry(String(ev.target.result || ''));
              if (geo) setCustomMeshGeometry(geo, file.name);
              else notify(`Could not parse OBJ mesh: ${file.name}`);
            };
            reader.readAsText(file);
          }
        });
      };

      const triggerDownload = (content, filename, mime) => {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      const handleDownloadSvg = () => {
        if (!blueprintSvgRef.current) return;
        const xml = new XMLSerializer().serializeToString(blueprintSvgRef.current);
        triggerDownload(xml, `${domain}-asme-y14-5-v20.svg`, 'image/svg+xml;charset=utf-8');
        notify('Downloaded .SVG ASME Blueprint');
      };

      const handleDownloadStl = () => {
        if (!getStlRef.current) return;
        triggerDownload(getStlRef.current(), `${domain}-v20-solid.stl`, 'application/sla');
        notify('Downloaded .STL Solid Mesh');
      };

      const handleDownloadMbdJson = () => {
        const packet = {
          schema: 'AEGIS-QADS-SBC350-V16-V20-MBD',
          generatedAt: new Date().toISOString(),
          domain,
          units,
          deckHeightIn,
          titleBlock: titleMeta,
          parametricDimensions: params,
          telemetry,
          boltSequence17: { activeStep: boltSequenceStep, pass: boltTorquePass },
          sectionPlane: { axis: sliceAxis, percent: slicePercent },
          activeMatrixCount: activeMatrixItems.length,
          partsMatrix: activeMatrixItems
        };
        triggerDownload(JSON.stringify(packet, null, 2), `${domain}-aegis-mbd-v20.json`, 'application/json');
        notify('Downloaded .JSON MBD Specification Packet');
      };

      const applyLibraryEntryToBench = (item, forceDomain) => {
        const targetDomain = forceDomain || item.domain || domain;
        setDomain(targetDomain);
        setParams((prev) => ({
          ...prev,
          boreIn: item.boreIn || prev.boreIn,
          strokeIn: item.strokeIn || prev.strokeIn,
          wallIn: item.wallIn || prev.wallIn,
          boltCount: item.boltCount || prev.boltCount,
          filletIn: item.filletIn || prev.filletIn,
          materialId: item.materialId || prev.materialId
        }));
        if (item.subsystem) setSelectedSubsystem(item.subsystem);
        notify(`Loaded "${item.name}" onto 3D Bench`);
      };

      const handleAskCoPilot = async (customPromptText) => {
        const query = (customPromptText || aiPrompt).trim();
        if (!query) return;
        setAiPrompt('');
        setAiMessages((prev) => [...prev, { role: 'user', text: query }]);
        setAiLoading(true);

        const synthesizePresetFromPrompt = (text) => {
          const lower = text.toLowerCase();
          if (lower.includes('sbc-350') || lower.includes('v16') || lower.includes('383') || lower.includes('head bolt')) {
            const nextDomain = 'sbc-350-v16';
            const nextParams = { boreIn: 4.030, strokeIn: 3.750, wallIn: 0.26, boltCount: 17, filletIn: 0.30, materialId: 'chromoly4140' };
            setDomain(nextDomain);
            setParams(nextParams);
            setSelectedSubsystem('Engine Block & Sump');
            return {
              code: 'SBC-V16-383',
              summary: 'Applied SBC-350 v16 Stroker / 17-Bolt Datum spec (Bore Ø 4.030 in, Stroke 3.750 in, Chromoly 4140) to the 3D bench.'
            };
          }
          if (lower.includes('billet intake plenum')) {
            const nextDomain = 'sbc-350-v20';
            const nextParams = { boreIn: 4.100, strokeIn: 3.480, wallIn: 0.24, boltCount: 18, filletIn: 0.35, materialId: 'al7075' };
            setDomain(nextDomain);
            setParams(nextParams);
            setSelectedSubsystem('Intake & Fuel Rail');
            return {
              code: 'QADS-PL-2020',
              summary: 'Synthesized Billet Intake Plenum (7075-T651, Bore Ø 4.100 in, Wall 0.240 in, Fillet R0.350 in, ASME Y14.5 IT6) and applied to SBC-350 v20.'
            };
          }
          if (lower.includes('titanium gimbal bracket')) {
            const nextDomain = 'aerospace-v20';
            const nextParams = { boreIn: 5.800, strokeIn: 4.500, wallIn: 0.28, boltCount: 24, filletIn: 0.45, materialId: 'ti6al4v' };
            setDomain(nextDomain);
            setParams(nextParams);
            setSelectedSubsystem('2-Axis Gimbal Ring');
            return {
              code: 'QADS-GB-5824',

            (item.notes || '').toLowerCase().includes(q);
          return catOk && statusOk && searchOk;

                          type="button"
                          onClick={handleDownloadSvg}
                          className="w-full min-h-[44px] px-4 rounded-lg bg-sky-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
                        >
                          ↓ Download .SVG ASME Y14.5M Blueprint
                        </button>

                        <button
                          type="button"
                          onClick={handleDownloadStl}
                          className="w-full min-h-[44px] px-4 rounded-lg bg-amber-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
                        >
                          ↓ Download .STL 3D Mesh
                        </button>

                        <button
                          type="button"
                          onClick={handleDownloadMbdJson}
                          className="w-full min-h-[44px] px-4 rounded-lg bg-emerald-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95"
                        >
                          ↓ Download .JSON MBD Specification Packet
                        </button>
                      </div>
                    </div>
                  )}

                  {/* ROOM 7: JESSE 24FPS CINEMA STANDARD & GEMINI AI CO-PILOT */}
                  {activeRoom === 'cinema' && (
                    <div className="space-y-3 flex flex-col">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                        <h2 className="text-sm font-bold uppercase tracking-wider text-amber-300">
                          Jesse 24fps Cinema &amp; Gemini AI
                        </h2>
                        <span className="font-mono-tabular text-[11px] text-sky-300">24 FPS · 50MM · 369</span>
                      </div>

                      <div className="p-2.5 rounded-lg bg-amber-500/10 border border-amber-400/40 text-[11px] text-amber-100 leading-relaxed">
                        <span className="font-mono-tabular font-bold text-amber-300">VEO PAYWALLED — FREE ROUTE NOTICE: </span>
                        Veo is paywalled, so no Veo video clip is promised or generated here. Free routes use your real footage or stills with slow zooms / Ken Burns motion at 24 fps.
                      </div>

                      <div className="space-y-1.5">
                        {JESSE_SHOT_TEMPLATES.map((shot) => (
                          <button
                            key={shot.id}
                            type="button"
                            onClick={() => setJesseShotId(shot.id)}
                            className={`w-full min-h-[44px] px-3 py-2 rounded-lg text-left text-xs font-semibold touch-manipulation transition ${
                              jesseShotId === shot.id
                                ? 'bg-sky-400 text-slate-950'
                                : 'bg-[#070A10] text-slate-200 border border-slate-800'
                            }`}
                          >
                            {shot.title}
                          </button>
                        ))}
                      </div>

                      <div className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
                        <div className="flex items-center justify-between text-[11px] font-mono-tabular">
                          <span className="text-sky-300 font-bold">24 FPS SLOW-ZOOM PREVIEW ({jesseScrubPct}%)</span>
                          <button
                            type="button"
                            onClick={() => setJessePlaying((p) => !p)}
                            className="min-h-[44px] px-3 rounded-lg bg-slate-900 border border-slate-700 text-xs font-bold text-emerald-300 touch-manipulation"
                          >
                            {jessePlaying ? '❚❚ Pause 24fps' : '▶ Play 24fps'}
                          </button>
                        </div>

                        <div className="relative h-36 w-full overflow-hidden rounded-lg border border-slate-700 bg-[#050810] flex items-center justify-center">
                          <div
                            style={{
                              transform: `scale(${(1 + (jesseScrubPct / 100) * 0.16).toFixed(3)})`,
                              filter: `${jesseWarmGoldGrade ? 'sepia(0.28) contrast(1.06) ' : ''}${jesseFineGrain ? 'saturate(1.12)' : ''}`
                            }}
                            className="w-full h-full flex flex-col items-center justify-center p-3 text-center transition-transform duration-75"
                          >
                            {jesseSourceMediaUrl ? (
                              <img
                                src={jesseSourceMediaUrl}
                                alt={jesseSourceMediaName || 'Still / Footage Frame'}
                                className="w-full h-full object-cover rounded"
                              />
                            ) : (
                              <>
                                <div className="font-mono-tabular text-[11px] font-bold text-amber-300">
                                  EMBLEM OPEN → 369 CLOSE · 50MM SHARP / SOFT BG
                                </div>
                                <div className="text-xs text-slate-200 mt-1">
                                  {activeJesseShot.move} · {activeJesseShot.lighting}
                                </div>
                                <div className="font-mono-tabular text-[10px] text-sky-300 mt-1">
                                  BAND TOGETHER IN ONE LIVE SCENE · NO MORPHING
                                </div>
                              </>
                            )}
                          </div>
                        </div>

                        <input
                          type="range"
                          min="0"
                          max="100"
                          step="0.5"
                          value={jesseScrubPct}
                          onChange={(e) => setJesseScrubPct(parseFloat(e.target.value) || 0)}
                          className="w-full h-3 accent-sky-400 cursor-pointer"
                        />

                        <div className="grid grid-cols-2 gap-1.5">
                          <button
                            type="button"
                            onClick={() => setJesseWarmGoldGrade((g) => !g)}
                            className={`min-h-[44px] px-2 rounded-lg font-mono-tabular text-[11px] font-bold touch-manipulation ${
                              jesseWarmGoldGrade
                                ? 'bg-amber-400 text-slate-950'
                                : 'bg-slate-900 text-slate-300 border border-slate-700'
                            }`}
                          >
                            Warm Gold: {jesseWarmGoldGrade ? 'ON' : 'OFF'}
                          </button>
                          <button
                            type="button"
                            onClick={() => setJesseFineGrain((g) => !g)}
                            className={`min-h-[44px] px-2 rounded-lg font-mono-tabular text-[11px] font-bold touch-manipulation ${
                              jesseFineGrain
                                ? 'bg-sky-400 text-slate-950'
                                : 'bg-slate-900 text-slate-300 border border-slate-700'
                            }`}
                          >
                            Fine Grain: {jesseFineGrain ? 'ON' : 'OFF'}
                          </button>
                        </div>

                        <label className="w-full min-h-[44px] px-3 rounded-lg bg-slate-900 border border-slate-700 font-mono-tabular text-xs font-semibold text-emerald-300 flex items-center justify-center cursor-pointer touch-manipulation">
                          ↑ Load Still / Footage for Free Slow Zoom
                          <input
                            type="file"
                            accept="image/*,video/*"
                            className="hidden"
                            onChange={(e) => {
                              const f = e.target.files && e.target.files[0];
                              if (!f) return;
                              const nextUrl = URL.createObjectURL(f);
                              if (prevJesseMediaUrlRef.current) URL.revokeObjectURL(prevJesseMediaUrlRef.current);
                              prevJesseMediaUrlRef.current = nextUrl;
                              setJesseSourceMediaUrl(nextUrl);
                              setJesseSourceMediaName(f.name);
                              e.target.value = '';
                              notify(`Loaded still/footage: ${f.name}`);
                            }}
                          />
                        </label>
                      </div>

                      <div className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 space-y-2">
                        <div className="text-[11px] font-mono-tabular text-sky-300 font-bold">
                          JESSE STANDARD PROMPT (24 FPS · 50MM · 369)
                        </div>
                        <p className="text-[11px] text-slate-200 leading-relaxed select-text">
                          {composedJessePrompt}
                        </p>
                        <button
                          type="button"
                          onClick={() => {
                            try {
                              if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(composedJessePrompt).catch(() => {});
                              }
                            } catch (_e) {}
                            notify('Copied Jesse 24fps Standard Prompt');
                          }}
                          className="w-full min-h-[44px] px-3 rounded-lg bg-sky-400 text-slate-950 font-mono-tabular text-xs font-bold touch-manipulation active:scale-95"
                        >
                          Copy Jesse Standard Prompt
                        </button>
                      </div>

                      <input
                        type="password"
                        value={geminiApiKey}
                        onChange={(e) => setGeminiApiKey(e.target.value)}
                        placeholder="Optional Gemini API Key (works offline too)..."
                        className="w-full min-h-[44px] px-3 rounded-lg bg-[#070A10] border border-slate-700 font-mono-tabular text-xs text-slate-200 focus:outline-none focus:border-sky-400"
                      />

                      <div className="min-h-[140px] max-h-[210px] overflow-y-auto space-y-2 p-2.5 rounded-lg bg-[#070A10] border border-slate-800">
                        {aiMessages.map((msg, i) => (
                          <div
                            key={i}
                            className={`p-2 rounded-lg text-xs whitespace-pre-line leading-relaxed ${
                              msg.role === 'user'
                                ? 'bg-sky-500/15 border border-sky-400/40 text-sky-100 ml-4'
                                : 'bg-[#0E1420] border border-slate-800 text-slate-200 mr-3'
                            }`}
                          >
                            {msg.text}
                          </div>
                        ))}
                        {aiLoading && (
                          <div className="text-xs font-mono-tabular text-amber-300 animate-pulse">
                            Synthesizing CAD &amp; 24fps shot specs...
                          </div>
                        )}
                      </div>

                      <form
                        onSubmit={(e) => {
                          e.preventDefault();
                          handleAskCoPilot();
                        }}
                        className="flex gap-2"
                      >
                        <input
                          type="text"
                          value={aiPrompt}
                          onChange={(e) => setAiPrompt(e.target.value)}
                          placeholder="Ask Gemini Co-Pilot to tune part or shot..."
                          className="flex-1 min-h-[44px] px-3 rounded-lg bg-[#070A10] border border-slate-700 text-xs text-slate-100 focus:outline-none focus:border-sky-400"
                        />
                        <button
                          type="submit"
                          disabled={aiLoading}
                          className="min-h-[44px] px-4 rounded-lg bg-sky-400 text-slate-950 text-xs font-bold touch-manipulation active:scale-95 disabled:opacity-50"
                        >
                          Generate
                        </button>
                      </form>
                    </div>
                  )}
                </aside>
              )}
            </div>

            {/* =============================================================== */}
            {/* 4. STANDARDS, ALLOYS & TORQUE SEQUENCES MODAL                   */}
            {/* =============================================================== */}
            {standardsOpen && (
              <div
                onClick={() => setStandardsOpen(false)}
                className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="w-full max-w-3xl max-h-[86vh] overflow-y-auto rounded-xl bg-[#0E1420] border border-slate-700 p-5 space-y-4 shadow-2xl"
                >
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h3 className="text-sm font-bold uppercase tracking-wider text-sky-400">
                        ASME Y14.5-2018 Tolerances, Alloys &amp; Torque Schedules
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Quantum Aerospace &amp; SBC-350 v16/v20 Merged CAD &amp; Manufacturing Studio
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setStandardsOpen(false)}
                      className="min-h-[44px] min-w-[44px] px-3 rounded-lg bg-slate-900 border border-slate-700 text-xs font-bold text-slate-200 touch-manipulation"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-bold text-amber-300 uppercase">GD&amp;T &amp; Manufacturing Standards</div>
                    {TOLERANCE_STANDARDS.map((t) => (
                      <div key={t.code} className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 text-xs">
                        <span className="font-mono-tabular text-sky-300 font-bold">{t.code}:</span>{' '}
                        <span className="text-slate-300">{t.spec}</span>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-bold text-sky-300 uppercase">Torque Pass Schedules</div>
                    {TORQUE_SEQUENCES.map((tq) => (
                      <div key={tq.assembly} className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 text-xs">
                        <div className="font-bold text-slate-100">{tq.assembly} ({tq.pattern})</div>
                        <div className="font-mono-tabular text-[11px] text-amber-200 mt-0.5">{tq.passes}</div>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-bold text-emerald-300 uppercase">Alloys &amp; Thermal Specs</div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {ALLOYS.map((a) => (
                        <div key={a.id} className="p-2.5 rounded-lg bg-[#070A10] border border-slate-800 text-xs font-mono-tabular">
                          <div className="font-sans font-bold text-slate-100">{a.name}</div>
                          <div className="text-[11px] text-slate-400 mt-1">
                            ρ: {a.densityLbIn3} lb/in³ · σy: {a.yieldMPa} MPa · Tmax: {a.maxTempC}°C
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {toast && (
              <div className="fixed bottom-12 left-4 z-50 px-4 py-2.5 rounded-lg bg-[#151E30] border border-sky-400/70 text-xs font-mono-tabular text-sky-200 shadow-2xl">
                {toast}
              </div>
            )}
          </div>
        </StudioErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudioApp />);
  </script>
</body>
</html>
